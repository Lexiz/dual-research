<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 760" font-family="'Roboto Flex', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>connector-map · material · light</title>
  <desc>OrderFlow worked example. ViewBox 1660x760. Composes md-card service-primary hub, 8 md-card spokes (sql/store/slate/cache/secure variants) arranged in two concentric rings, info-blue solid + bidirectional arrows, monogram tiles per category.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#ece8de"/>
    </linearGradient>
    <filter id="elev1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#14171c" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#14171c" flood-opacity="0.06"/>
    </filter>
    <filter id="elev3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14171c" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#14171c" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b9cf0"/>
    </marker>
    <marker id="arrowAccentSm" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6b9cf0"/>
    </marker>
  </defs>

  <rect width="1660" height="760" fill="url(#canvas)"/>

  <text x="830" y="48" text-anchor="middle" font-size="24" font-weight="500" fill="#04060a"
        font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.3">OrderFlow · Connector Map</text>
  <text x="830" y="72" text-anchor="middle" font-size="13" fill="#4d5159">One ingress · 8 third-party integrations · two concentric rings by traffic class</text>

  <!-- ring guides -->
  <circle cx="830" cy="380" r="285" fill="none" stroke="#d2cdc0" stroke-dasharray="2,5" opacity="0.7"/>
  <circle cx="830" cy="380" r="470" fill="none" stroke="#d2cdc0" stroke-dasharray="2,5" opacity="0.5"/>
  <text x="830" y="100" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#9aa0ac">OUTER RING · TELEMETRY &amp; ADMIN</text>
  <text x="830" y="200" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="2" fill="#9aa0ac">INNER RING · PRIMARY INTEGRATIONS</text>

  <!-- ===== HUB · md-card service-primary ===== -->
  <g transform="translate(670, 300)">
    <rect width="320" height="160" rx="12" ry="12" fill="#eaddcb" filter="url(#elev3)"/>

    <g transform="translate(28, 56) scale(0.05)" fill="#3b2810">
      <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-82q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z"/>
    </g>

    <g transform="translate(214, 22)">
      <rect width="76" height="22" rx="11" ry="11" fill="#dfe9fb"/>
      <circle cx="14" cy="11" r="3" fill="#6b9cf0"/>
      <text x="24" y="15" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b9cf0">LIVE</text>
    </g>

    <text x="98" y="58" font-size="22" font-weight="500" fill="#3b2810"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.3">OrderFlow API</text>
    <text x="98" y="80" font-size="12" fill="#5e4318">single ingress · v3.2 · mTLS</text>

    <line x1="28" y1="98" x2="292" y2="98" stroke="rgba(59,40,16,0.18)" stroke-width="1"/>

    <text x="28" y="118" font-size="10" font-weight="600" letter-spacing="0.5" fill="#7a5728">INGRESS</text>
    <text x="28" y="138" font-size="12" fill="#3b2810" font-variant-numeric="tabular-nums">api.orderflow.io</text>
    <text x="28" y="154" font-size="11" font-style="italic" fill="#7a5728"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">per-tenant · regional fan-out</text>
  </g>

  <!-- ===== INNER RING (4 spokes, 180x80) ===== -->
  <!-- Stripe · sql -->
  <g transform="translate(340, 220)">
    <rect width="180" height="80" rx="12" ry="12" fill="#d3dbe7" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#27344b"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#d6e3ff">ST</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#0a1d44"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Stripe</text>
    <text x="68" y="50" font-size="10" fill="#1b3060">payments</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#3a5895"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">cards · ACH · 3DS2</text>
  </g>

  <!-- PayPal · sql -->
  <g transform="translate(1140, 220)">
    <rect width="180" height="80" rx="12" ry="12" fill="#d3dbe7" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#27344b"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#d6e3ff">PP</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#0a1d44"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">PayPal</text>
    <text x="68" y="50" font-size="10" fill="#1b3060">alt payments</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#3a5895"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">Express Checkout</text>
  </g>

  <!-- SendGrid · store -->
  <g transform="translate(340, 460)">
    <rect width="180" height="80" rx="12" ry="12" fill="#eadfce" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#3a332e"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#eadfce">SG</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#544433"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">SendGrid</text>
    <text x="68" y="50" font-size="10" fill="#604d3a">email</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#7a5728"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">receipts · shipping</text>
  </g>

  <!-- Salesforce · sql · 2-way -->
  <g transform="translate(1140, 460)">
    <rect width="180" height="80" rx="12" ry="12" fill="#d3dbe7" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#27344b"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#d6e3ff">SF</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#0a1d44"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Salesforce</text>
    <text x="68" y="50" font-size="10" fill="#1b3060">CRM</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#3a5895"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">B2B roster · 2-way</text>
  </g>

  <!-- ===== OUTER RING (4 spokes) ===== -->
  <!-- Auth0 · secure · 2-way -->
  <g transform="translate(80, 120)">
    <rect width="180" height="80" rx="12" ry="12" fill="#d6e1d0" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#263630"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#a9d2b3">A0</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#446e51"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Auth0</text>
    <text x="68" y="50" font-size="10" fill="#566f59">identity</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#456546"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">OIDC · MFA admins</text>
  </g>

  <!-- Snowflake · slate -->
  <g transform="translate(1400, 120)">
    <rect width="180" height="80" rx="12" ry="12" fill="#d8dadf" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#2c3036"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#c8ccd4">SN</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#2c3036"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Snowflake</text>
    <text x="68" y="50" font-size="10" fill="#3d424a">warehouse</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#525860"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">Snowpipe · BI</text>
  </g>

  <!-- Twilio · store -->
  <g transform="translate(80, 540)">
    <rect width="180" height="80" rx="12" ry="12" fill="#eadfce" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#3a332e"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#eadfce">TW</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#544433"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Twilio</text>
    <text x="68" y="50" font-size="10" fill="#604d3a">SMS</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#7a5728"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">shipping · MFA codes</text>
  </g>

  <!-- Sentry · cache -->
  <g transform="translate(1400, 540)">
    <rect width="180" height="80" rx="12" ry="12" fill="#ebdfca" filter="url(#elev1)"/>
    <rect x="16" y="20" width="40" height="40" rx="8" ry="8" fill="#373026"/>
    <text x="36" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#e6c69a">SE</text>
    <text x="68" y="32" font-size="13" font-weight="500" fill="#816238"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">Sentry</text>
    <text x="68" y="50" font-size="10" fill="#7a5728">telemetry</text>
    <text x="68" y="66" font-size="10" font-style="italic" fill="#7a5728"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">errors · release health</text>
  </g>

  <!-- ===== ARROWS hub ↔ spokes ===== -->
  <!-- Inner: Stripe -->
  <line x1="665" y1="338" x2="525" y2="270" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="605" y="292" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">REST</text>

  <!-- Inner: PayPal -->
  <line x1="995" y1="338" x2="1135" y2="270" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="1062" y="292" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">REST</text>

  <!-- Inner: SendGrid -->
  <line x1="665" y1="418" x2="525" y2="490" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="600" y="440" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">WEBHOOK</text>

  <!-- Inner: Salesforce - 2-way -->
  <line x1="995" y1="418" x2="1135" y2="490" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"/>
  <text x="1060" y="440" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">REST · 2-WAY</text>

  <!-- Outer: Auth0 - 2-way (curves above inner ring) -->
  <path d="M 750 300 Q 470 120 265 178" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"/>
  <text x="475" y="148" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">OIDC · 2-WAY</text>

  <!-- Outer: Snowflake (curves above inner ring) -->
  <path d="M 910 300 Q 1190 120 1395 178" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="1185" y="148" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">gRPC</text>

  <!-- Outer: Twilio (curves below inner ring) -->
  <path d="M 750 460 Q 470 640 265 562" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="475" y="632" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">REST</text>

  <!-- Outer: Sentry (curves below inner ring) -->
  <path d="M 910 460 Q 1190 640 1395 562" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"/>
  <text x="1185" y="632" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">HTTPS</text>

  <!-- legend -->
  <line x1="56" y1="676" x2="1604" y2="676" stroke="#d2cdc0" stroke-width="1"/>
  <text x="56" y="704" font-size="11" font-weight="600" letter-spacing="0.5" fill="#6f7480">CONNECTOR MAP</text>
  <text x="56" y="724" font-size="12" fill="#3a3f47">Hub-and-spoke · 6 one-way + 2 two-way arrows (Salesforce, Auth0). Monogram tile colour encodes category — sql · store · slate · cache · secure.</text>
  <text x="56" y="744" font-size="11" font-style="italic" fill="#6f7480"
        font-family="'Roboto Serif', ui-serif, Georgia, serif">Read center-out — inner ring is sync payment + comms; outer ring is identity, warehouse, and telemetry.</text>
  <text x="1604" y="744" text-anchor="end" font-size="11" fill="#a8aab0" font-variant-numeric="tabular-nums">OrderFlow · connector-map · diagram skill v2.0.1 · 2026-05</text>
</svg>
