  <text x="1040" y="458" font-size="10" font-family="monospace" fill="#b4bac4">rule_results · weighted_sum</text>
  <text x="1040" y="474" font-size="10" font-family="monospace" fill="#b4bac4">verdict · confidence</text>

  <text x="1460" y="394" text-anchor="middle" font-size="10" font-weight="600" fill="#9aa0ac" letter-spacing="1.6">OUTPUT</text>
  <rect x="1340" y="408" width="240" height="76" rx="10" fill="#111317" stroke="#3a3a47"></rect>
  <text x="1360" y="430" font-size="12" font-weight="600" fill="#b4bac4">verdict_v1</text>
  <line x1="1360" y1="442" x2="1560" y2="442" stroke="#3a3a47"></line>
  <text x="1360" y="458" font-size="10" font-family="monospace" fill="#b4bac4">payload · signature</text>
  <text x="1360" y="474" font-size="10" font-family="monospace" fill="#b4bac4">posted_to[] · timestamps</text>

  
  
  <path d="M 820 215 C 820 180 660 180 500 180" stroke="#6b9cf0" stroke-width="1.6" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowAccentSm)"></path>
  <g transform="translate(610, 168)">
    <rect width="120" height="22" rx="11" fill="#21252b" stroke="#6b9cf0"></rect>
    <text x="60" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#6b9cf0" letter-spacing="0.8">REPAIR TURN · 1×</text>
  </g>

  
  <line x1="60" y1="540" x2="1600" y2="540" stroke="#3a3a47"></line>
  <text x="60" y="568" font-size="11" fill="#9aa0ac" letter-spacing="1.6" font-weight="600">CONTRACT</text>
  <text x="60" y="592" font-size="12" fill="#b4bac4">Each stage emits a typed output; the next stage refuses anything that fails the schema check.</text>
  <text x="60" y="612" font-size="12" fill="#b4bac4">The repair turn is the one feedback edge — it re-invokes the enricher when critique fails. Bounded to one cycle per run.</text>
  <text x="60" y="632" font-size="11" font-style="italic" fill="#9aa0ac">Read left-to-right · numbered stages · indigo arrows are typed handoffs · dashed loop is the bounded repair turn.</text>
