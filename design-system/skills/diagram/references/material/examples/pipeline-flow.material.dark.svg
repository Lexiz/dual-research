  <text x="400" y="458" font-size="10" font-family="monospace" fill="#b4bac4">company_profile · officers</text>
  <text x="400" y="474" font-size="10" font-family="monospace" fill="#b4bac4">filings[] · web_signals</text>

  <text x="820" y="394" text-anchor="middle" font-size="10" font-weight="600" fill="#9aa0ac" letter-spacing="1.6">OUTPUT</text>
  <rect x="700" y="408" width="240" height="76" rx="10" fill="#111317" stroke="#3a3a47"></rect>
  <text x="720" y="430" font-size="12" font-weight="600" fill="#b4bac4">findings_t</text>
  <line x1="720" y1="442" x2="920" y2="442" stroke="#3a3a47"></line>
  <text x="720" y="458" font-size="10" font-family="monospace" fill="#b4bac4">phase_outputs[]</text>
  <text x="720" y="474" font-size="10" font-family="monospace" fill="#b4bac4">redflags[] · evidence_refs[]</text>

