<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 780" font-family="'Roboto Flex', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>sequence · material · light</title>
  <desc>OrderFlow worked example. ViewBox 1660x780. Five vertical lanes (Shopper, Web app, Order API, Payment Service, Stripe) with lane.header md-card--filled, lane.vertical dashed lifelines, lane.activation-box surface overlays, and sync-call / async-event / return arrows in --md-tertiary info-blue.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#ece8de"/>
    </linearGradient>
    <filter id="elev1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#14171c" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#14171c" flood-opacity="0.06"/>
    </filter>
    <filter id="elev3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14171c" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#14171c" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b9cf0"/>
    </marker>
    <marker id="arrowAccentSm" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6b9cf0"/>
    </marker>
    <marker id="arrowOpen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7" stroke="#6b9cf0" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1660" height="780" fill="url(#canvas)"/>

  <!-- Title -->
  <text x="830" y="56" text-anchor="middle" font-size="26" font-weight="500" fill="#04060a"
        font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.3">OrderFlow · Checkout · Sequence</text>
  <text x="830" y="80" text-anchor="middle" font-size="13" fill="#4d5159">Cart submit through to OAuth-gated 3-D Secure capture and receipt</text>

  <!-- Lane 1: Shopper · md-card outlined -->
  <g transform="translate(110, 120)">
    <rect width="240" height="56" rx="12" ry="12" fill="#faf9f6" stroke="#d2cdc0" stroke-width="1"/>
    <g transform="translate(16, 36) scale(0.025)" fill="#3a3f47">
      <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/>
    </g>
    <text x="56" y="28" font-size="15" font-weight="500" fill="#04060a"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.1">Shopper</text>
    <text x="56" y="46" font-size="11" fill="#6f7480">external · web + iOS</text>
  </g>

  <!-- Lane 2: Web app · md-card outlined -->
  <g transform="translate(410, 120)">
    <rect width="240" height="56" rx="12" ry="12" fill="#faf9f6" stroke="#d2cdc0" stroke-width="1"/>
    <g transform="translate(16, 36) scale(0.025)" fill="#3a3f47">
      <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H160v400Zm0-480h640v-80H160v80Z"/>
    </g>
    <text x="56" y="28" font-size="15" font-weight="500" fill="#04060a"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.1">Web app</text>
    <text x="56" y="46" font-size="11" fill="#6f7480">storefront · React</text>
  </g>

  <!-- Lane 3: Order API · md-card service-primary (sable hub variant) -->
  <g transform="translate(710, 120)">
    <rect width="240" height="56" rx="12" ry="12" fill="#eaddcb" filter="url(#elev3)"/>
    <g transform="translate(16, 36) scale(0.025)" fill="#3b2810">
      <path d="M120-160v-80h720v80H120Zm60-120v-200h120v200H180Zm180 0v-200h120v200H360Zm180 0v-200h120v200H540Zm180 0v-200h120v200H720ZM120-560v-120l360-180 360 180v120H120Z"/>
    </g>
    <text x="56" y="28" font-size="15" font-weight="500" fill="#3b2810"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.1">Order API</text>
    <text x="56" y="46" font-size="11" fill="#7a5728">REST · ingress gateway</text>
  </g>

  <!-- Lane 4: Payment Service · md-card service-secure (sage variant) -->
  <g transform="translate(1010, 120)">
    <rect width="240" height="56" rx="12" ry="12" fill="#d6e1d0" filter="url(#elev1)"/>
    <g transform="translate(16, 36) scale(0.025)" fill="#446e51">
      <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm240-120q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/>
    </g>
    <text x="56" y="28" font-size="15" font-weight="500" fill="#1f3a28"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.1">Payment Service</text>
    <text x="56" y="46" font-size="11" fill="#456546">auth · capture · refunds</text>
  </g>

  <!-- Lane 5: Stripe · md-card service-sql (info-blue variant) -->
  <g transform="translate(1310, 120)">
    <rect width="240" height="56" rx="12" ry="12" fill="#d3dbe7" filter="url(#elev1)"/>
    <g transform="translate(16, 36) scale(0.025)" fill="#0a1d44">
      <path d="M240-440h480v-80H240v80Zm0 200h480v-80H240v80ZM160-80q-33 0-56.5-23.5T80-160v-640q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v640q0 33-23.5 56.5T800-80H160Z"/>
    </g>
    <text x="56" y="28" font-size="15" font-weight="500" fill="#0a1d44"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.1">Stripe</text>
    <text x="56" y="46" font-size="11" fill="#3a5895">external · SCA / 3DS2</text>
  </g>

  <!-- Lifelines (outline-variant, dashed) -->
  <g stroke="#a8aab0" stroke-width="1" stroke-dasharray="3,4" opacity="0.7">
    <line x1="230" y1="176" x2="230" y2="708"/>
    <line x1="530" y1="176" x2="530" y2="708"/>
    <line x1="830" y1="176" x2="830" y2="708"/>
    <line x1="1130" y1="176" x2="1130" y2="708"/>
    <line x1="1430" y1="176" x2="1430" y2="708"/>
  </g>

  <!-- Activation boxes · service-tinted overlays -->
  <rect x="822" y="252" width="16" height="344" fill="#eaddcb" stroke="#cbb38a" stroke-width="0.5"/>
  <rect x="1122" y="308" width="16" height="288" fill="#d6e1d0" stroke="#9bbf9c" stroke-width="0.5"/>
  <rect x="1422" y="364" width="16" height="88" fill="#d3dbe7" stroke="#94a4c2" stroke-width="0.5"/>
  <rect x="1422" y="508" width="16" height="88" fill="#d3dbe7" stroke="#94a4c2" stroke-width="0.5"/>

  <!-- Row 1: Shopper → Web app · checkout(cart) -->
  <line x1="230" y1="216" x2="522" y2="216" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="376" y="208" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">CHECKOUT(CART)</text>
  <text x="376" y="232" text-anchor="middle" font-size="11" font-style="italic" fill="#6f7480" font-family="'Roboto Serif', ui-serif, Georgia, serif">tap "Pay" · 1 click</text>

  <!-- Row 2: Web app → Order API · POST /orders -->
  <line x1="530" y1="272" x2="822" y2="272" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="676" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">POST /ORDERS</text>
  <text x="676" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#6f7480" font-family="'Roboto Serif', ui-serif, Georgia, serif">{ line_items, address, idempotency_key }</text>

  <!-- Row 3: Order API → Payment Service · charge() -->
  <line x1="838" y1="328" x2="1122" y2="328" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="980" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">CHARGE(ORDER_ID, AMOUNT)</text>
  <text x="980" y="344" text-anchor="middle" font-size="11" font-style="italic" fill="#6f7480" font-family="'Roboto Serif', ui-serif, Georgia, serif">gRPC · order-svc → payment-svc</text>

  <!-- Row 4: Payment Service → Stripe -->
  <line x1="1138" y1="384" x2="1422" y2="384" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="1280" y="376" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">POST /PAYMENT_INTENTS</text>
  <text x="1280" y="400" text-anchor="middle" font-size="11" font-style="italic" fill="#6f7480" font-family="'Roboto Serif', ui-serif, Georgia, serif">capture_method=automatic · 3ds=required</text>

  <!-- Row 5: Stripe → Shopper · 3DS challenge (async return, long arc) -->
  <path d="M 1422 444 Q 830 472 230 460" stroke="#a8aab0" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"/>
  <text x="826" y="468" text-anchor="middle" font-size="11" font-weight="600" fill="#6f7480" letter-spacing="0.6">3-D SECURE CHALLENGE</text>
  <text x="826" y="488" text-anchor="middle" font-size="11" font-style="italic" fill="#8e919a" font-family="'Roboto Serif', ui-serif, Georgia, serif">redirect · issuer-hosted page · OOB push</text>

  <!-- Row 6: Shopper → Stripe -->
  <line x1="230" y1="508" x2="1422" y2="508" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
  <text x="826" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">AUTHENTICATES (biometric · OTP)</text>

  <!-- Row 7: Stripe → Payment Service · async-event webhook -->
  <line x1="1422" y1="552" x2="1138" y2="552" stroke="#6b9cf0" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"/>
  <text x="1280" y="544" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">PAYMENT_INTENT.SUCCEEDED</text>
  <text x="1280" y="568" text-anchor="middle" font-size="11" font-style="italic" fill="#6f7480" font-family="'Roboto Serif', ui-serif, Georgia, serif">webhook · async-event · signed</text>

  <!-- Row 8: Payment Service → Order API · return -->
  <line x1="1122" y1="596" x2="838" y2="596" stroke="#6b9cf0" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"/>
  <text x="980" y="588" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">200 · CAPTURE CONFIRMED</text>

  <!-- Row 9: Order API → Web app · return -->
  <line x1="822" y1="636" x2="530" y2="636" stroke="#6b9cf0" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"/>
  <text x="676" y="628" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">200 OK · { ORDER_ID, STATUS:PAID }</text>

  <!-- Row 10: Web app → Shopper · return -->
  <line x1="522" y1="676" x2="230" y2="676" stroke="#6b9cf0" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"/>
  <text x="376" y="668" text-anchor="middle" font-size="11" font-weight="600" fill="#6b9cf0" letter-spacing="0.6">RECEIPT + TRACKING LINK</text>

  <!-- Side note · md-card filled with tertiary accent -->
  <g transform="translate(40, 392)">
    <rect width="172" height="82" rx="12" ry="12" fill="#faf9f6" stroke="#d2cdc0" stroke-width="1" filter="url(#elev1)"/>
    <rect x="0" y="0" width="3" height="82" rx="1.5" ry="1.5" fill="#6b9cf0"/>
    <text x="14" y="22" font-size="10" font-weight="600" letter-spacing="0.6" fill="#6b9cf0">NOTE</text>
    <text x="14" y="42" font-size="12" fill="#3a3f47">3DS frictionless path</text>
    <text x="14" y="58" font-size="12" fill="#3a3f47">skips rows 5–6 entirely;</text>
    <text x="14" y="74" font-size="12" fill="#3a3f47">webhook fires &lt; 1.2 s.</text>
  </g>

  <!-- Legend -->
  <line x1="56" y1="724" x2="1604" y2="724" stroke="#d2cdc0" stroke-width="1"/>

  <g transform="translate(56, 748)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#6b9cf0" stroke-width="1.8" marker-end="url(#arrowAccent)"/>
    <text x="44" y="3" font-size="12" fill="#4d5159">sync-call</text>

    <line x1="124" y1="0" x2="160" y2="0" stroke="#6b9cf0" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"/>
    <text x="168" y="3" font-size="12" fill="#4d5159">async-event</text>

    <line x1="260" y1="0" x2="296" y2="0" stroke="#6b9cf0" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"/>
    <text x="304" y="3" font-size="12" fill="#4d5159">return</text>

    <rect x="362" y="-6" width="10" height="12" fill="#eaddcb" stroke="#cbb38a" stroke-width="0.5"/>
    <text x="378" y="3" font-size="12" fill="#4d5159">activation box (actor busy)</text>
  </g>
  <text x="1604" y="751" text-anchor="end" font-size="11" fill="#a8aab0" font-variant-numeric="tabular-nums">OrderFlow · sequence · diagram skill v2.0.1 · 2026-05</text>
</svg>
