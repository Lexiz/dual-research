    </linearGradient>
    <linearGradient id="surfaceSecure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34805a"></stop><stop offset="100%" stop-color="#1d4f37"></stop>
    </linearGradient>
