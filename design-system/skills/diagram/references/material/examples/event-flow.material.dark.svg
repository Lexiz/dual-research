<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 720" font-family="'Roboto Flex', 'Roboto', system-ui, -apple-system, sans-serif">
  <title>event-flow · material · dark</title>
  <desc>OrderFlow worked example (Material, dark). ViewBox 1660x720. Producer order-svc publishes order.* events to the orders topic (md-card service-slate, 4 partitions); four consumers (inventory-svc, payment-svc, notification-svc, analytics) fan out. One error-path dashed-red arrow runs to a small DLQ card. Producer→topic arrows use --p-ok; topic→consumer arrows use --md-tertiary.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <filter id="elev1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="elev3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrowTertiary" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b9cf0"/>
    </marker>
    <marker id="arrowOk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6fb380"/>
    </marker>
    <marker id="arrowErr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d96a6a"/>
    </marker>
  </defs>

  <rect width="1660" height="720" fill="url(#canvas)"/>

  <g font-size="11" font-weight="600" letter-spacing="0.5" fill="#9aa0ac">
    <text x="230"  y="76" text-anchor="middle">PRODUCER</text>
    <text x="740"  y="76" text-anchor="middle">TOPIC · 4 PARTITIONS</text>
    <text x="1340" y="76" text-anchor="middle">CONSUMERS</text>
  </g>

  <text x="56" y="76" font-size="11" font-weight="600" letter-spacing="0.5" fill="#ffffff">
    OrderFlow · Event Flow
  </text>

  <!-- PRODUCER · order-svc · md-card filled -->
  <g transform="translate(72, 100)">
    <rect width="316" height="260" rx="12" ry="12" fill="#21252b" filter="url(#elev1)"/>
    <g transform="translate(24, 64) scale(0.0375)" fill="#b4bac4">
      <path d="M160-120v-200h640v200H160Zm80-80h60v-40h-60v40Zm480 0h60v-40h-60v40ZM160-440v-200h640v200H160Zm80-80h60v-40h-60v40Zm480 0h60v-40h-60v40ZM160-760v-80h640v80H160Z"/>
    </g>
    <text x="76" y="56" font-size="20" font-weight="500" fill="#ffffff"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">order-svc</text>
    <text x="76" y="80" font-size="12" fill="#b4bac4">Order Service · lifecycle orchestrator</text>

    <line x1="24" y1="108" x2="292" y2="108" stroke="#343941" stroke-width="1"/>
    <text x="24" y="130" font-size="10" font-weight="600" letter-spacing="0.5" fill="#9aa0ac">PUBLISHES</text>

    <rect x="24" y="142" width="268" height="26" rx="6" ry="6" fill="#14171c" stroke="#343941" stroke-width="1"/>
    <text x="34" y="159" font-size="12" font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#ffffff">order.created</text>
    <text x="282" y="159" text-anchor="end" font-size="10" font-style="italic" fill="#7d8290">~120k/day</text>

    <rect x="24" y="172" width="268" height="26" rx="6" ry="6" fill="#14171c" stroke="#343941" stroke-width="1"/>
    <text x="34" y="189" font-size="12" font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#ffffff">order.paid</text>
    <text x="282" y="189" text-anchor="end" font-size="10" font-style="italic" fill="#7d8290">on capture</text>

    <rect x="24" y="202" width="268" height="26" rx="6" ry="6" fill="#14171c" stroke="#343941" stroke-width="1"/>
    <text x="34" y="219" font-size="12" font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#ffffff">order.shipped</text>
    <text x="282" y="219" text-anchor="end" font-size="10" font-style="italic" fill="#7d8290">on dispatch</text>

    <rect x="24" y="232" width="268" height="26" rx="6" ry="6" fill="#14171c" stroke="#343941" stroke-width="1"/>
    <text x="34" y="249" font-size="12" font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#ffffff">order.cancelled</text>
    <text x="282" y="249" text-anchor="end" font-size="10" font-style="italic" fill="#7d8290">on void</text>
  </g>

  <!-- TOPIC · orders · md-card service-slate · 4 partitions -->
  <g transform="translate(560, 156)">
    <rect width="360" height="180" rx="12" ry="12" fill="#1e242e" filter="url(#elev3)"/>
    <g transform="translate(24, 64) scale(0.0375)" fill="#a8b1c4">
      <path d="M280-160 80-360l200-200 56 58-102 102h486v80H234l102 102-56 58Zm400-240-56-58 102-102H240v-80h486L624-742l56-58 200 200-200 200Z"/>
    </g>
    <text x="76" y="56" font-size="22" font-weight="500" fill="#cdd4e0"
          font-family="ui-monospace, 'JetBrains Mono', monospace" letter-spacing="-0.2">orders</text>
    <text x="76" y="80" font-size="12" fill="#a8b1c4">Kafka topic · 7d retention · at-least-once</text>

    <g transform="translate(300, 16)">
      <rect width="44" height="22" rx="11" ry="11" fill="rgba(168,177,196,0.18)"/>
      <text x="22" y="15" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5" fill="#cdd4e0">TOPIC</text>
    </g>

    <line x1="24" y1="108" x2="336" y2="108" stroke="#343941" stroke-width="1"/>
    <text x="24" y="130" font-size="10" font-weight="600" letter-spacing="0.5" fill="#9aa0ac">PARTITIONS</text>

    <g transform="translate(44, 154)">
      <circle r="14" fill="#0d0f12" stroke="#7d8290" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#cdd4e0" font-variant-numeric="tabular-nums">p0</text>
    </g>
    <g transform="translate(112, 154)">
      <circle r="14" fill="#0d0f12" stroke="#7d8290" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#cdd4e0" font-variant-numeric="tabular-nums">p1</text>
    </g>
    <g transform="translate(180, 154)">
      <circle r="14" fill="#0d0f12" stroke="#7d8290" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#cdd4e0" font-variant-numeric="tabular-nums">p2</text>
    </g>
    <g transform="translate(248, 154)">
      <circle r="14" fill="#0d0f12" stroke="#7d8290" stroke-width="1"/>
      <text y="4" text-anchor="middle" font-size="10" font-weight="600" fill="#cdd4e0" font-variant-numeric="tabular-nums">p3</text>
    </g>
    <text x="336" y="158" text-anchor="end" font-size="10" font-style="italic" fill="#9aa0ac"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">hash(order_id)</text>
  </g>

  <!-- CONSUMERS · md-card outlined, right column -->
  <g transform="translate(1100, 102)">
    <rect width="480" height="84" rx="12" ry="12" fill="#0d0f12" stroke="#262a31" stroke-width="1"/>
    <g transform="translate(24, 50) scale(0.0375)" fill="#b4bac4">
      <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm80-80h400v-80H280v80Zm0-160h400v-80H280v80Zm0-160h400v-80H280v80Z"/>
    </g>
    <text x="76" y="32" font-size="17" font-weight="500" fill="#ffffff"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">inventory-svc</text>
    <text x="76" y="52" font-size="12" fill="#b4bac4">decrements stock units · creates reservations</text>
    <text x="76" y="70" font-size="11" font-style="italic" fill="#7d8290"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">subscribes: <tspan font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#b4bac4">order.paid</tspan></text>
  </g>

  <g transform="translate(1100, 200)">
    <rect width="480" height="84" rx="12" ry="12" fill="#0d0f12" stroke="#262a31" stroke-width="1"/>
    <g transform="translate(24, 50) scale(0.0375)" fill="#b4bac4">
      <path d="M560-440q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35ZM280-320q-33 0-56.5-23.5T200-400v-320q0-33 23.5-56.5T280-800h560q33 0 56.5 23.5T920-720v320q0 33-23.5 56.5T840-320H280Zm80-80h400q0-33 23.5-56.5T840-480v-160q-33 0-56.5-23.5T760-720H360q0 33-23.5 56.5T280-640v160q33 0 56.5 23.5T360-400Zm440 240H120q-33 0-56.5-23.5T40-240v-440h80v440h680v80ZM280-400v-320 320Z"/>
    </g>
    <text x="76" y="32" font-size="17" font-weight="500" fill="#ffffff"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">payment-svc</text>
    <text x="76" y="52" font-size="12" fill="#b4bac4">refunds via Stripe · releases payment authorisations</text>
    <text x="76" y="70" font-size="11" font-style="italic" fill="#7d8290"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">subscribes: <tspan font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#b4bac4">order.cancelled</tspan></text>
  </g>

  <g transform="translate(1100, 298)">
    <rect width="480" height="84" rx="12" ry="12" fill="#0d0f12" stroke="#262a31" stroke-width="1"/>
    <g transform="translate(24, 50) scale(0.0375)" fill="#b4bac4">
      <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280 320-210v-90L480-520 160-730v90l320 210Z"/>
    </g>
    <text x="76" y="32" font-size="17" font-weight="500" fill="#ffffff"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">notification-svc</text>
    <text x="76" y="52" font-size="12" fill="#b4bac4">emails + SMS via SendGrid + Twilio · debounced 5 s</text>
    <text x="76" y="70" font-size="11" font-style="italic" fill="#7d8290"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">subscribes: <tspan font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#b4bac4">ALL order.*</tspan></text>
  </g>

  <g transform="translate(1100, 396)">
    <rect width="480" height="84" rx="12" ry="12" fill="#0d0f12" stroke="#262a31" stroke-width="1"/>
    <g transform="translate(24, 50) scale(0.0375)" fill="#b4bac4">
      <path d="M120-120v-80h720v80H120Zm60-120v-280h120v280H180Zm180 0v-440h120v440H360Zm180 0v-200h120v200H540Zm180 0v-360h120v360H720Z"/>
    </g>
    <text x="76" y="32" font-size="17" font-weight="500" fill="#ffffff"
          font-family="'Roboto Serif', ui-serif, Georgia, serif" letter-spacing="-0.2">analytics</text>
    <text x="76" y="52" font-size="12" fill="#b4bac4">streams all events to Snowflake via Snowpipe</text>
    <text x="76" y="70" font-size="11" font-style="italic" fill="#7d8290"
          font-family="'Roboto Serif', ui-serif, Georgia, serif">subscribes: <tspan font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#b4bac4">ALL order.*</tspan></text>
  </g>

  <!-- DLQ -->
  <g transform="translate(1280, 510)">
    <rect width="300" height="52" rx="10" ry="10" fill="rgba(217,106,106,0.14)" stroke="#d96a6a" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="14" y="22" font-size="11" font-weight="600" letter-spacing="0.6" fill="#e89490">DLQ · RETRY EXCEEDED</text>
    <text x="14" y="40" font-size="10" font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#d9a8a6">orders.dlq · PagerDuty alert</text>
  </g>

  <!-- arrows: producer → topic -->
  <path d="M 392 200 C 470 200 480 220 558 220" stroke="#6fb380" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOk)"/>
  <path d="M 392 232 L 558 240" stroke="#6fb380" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOk)"/>
  <path d="M 392 262 L 558 260" stroke="#6fb380" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOk)"/>
  <path d="M 392 292 C 470 292 480 280 558 280" stroke="#6fb380" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOk)"/>
  <text x="475" y="194" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" fill="#9bd4ad">PUBLISH · async-event</text>

  <!-- arrows: topic → consumers -->
  <path d="M 920 210 C 1010 210 1010 144 1098 144" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowTertiary)"/>
  <text x="1010" y="166" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#a4c1ff" font-family="ui-monospace, 'JetBrains Mono', monospace">order.paid</text>

  <path d="M 920 232 L 1098 242" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowTertiary)"/>
  <text x="1010" y="226" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#a4c1ff" font-family="ui-monospace, 'JetBrains Mono', monospace">order.cancelled</text>

  <path d="M 920 264 C 1010 264 1010 340 1098 340" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowTertiary)"/>
  <text x="1010" y="304" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#a4c1ff" font-family="ui-monospace, 'JetBrains Mono', monospace">ALL order.*</text>

  <path d="M 920 290 C 1010 290 1010 438 1098 438" stroke="#6b9cf0" stroke-width="1.8" fill="none" marker-end="url(#arrowTertiary)"/>
  <text x="1010" y="394" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.4" fill="#a4c1ff" font-family="ui-monospace, 'JetBrains Mono', monospace">ALL order.*</text>

  <!-- error-path · payment-svc → DLQ -->
  <path d="M 1340 284 C 1340 400 1408 400 1408 508" stroke="#d96a6a" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowErr)"/>
  <text x="1352" y="378" font-size="10" font-weight="600" letter-spacing="0.4" fill="#e89490">retry &gt; 5 ✕ exp backoff</text>
  <text x="1352" y="394" font-size="10" font-style="italic" fill="#d9a8a6"
        font-family="'Roboto Serif', ui-serif, Georgia, serif">→ DLQ + PagerDuty</text>

  <!-- legend -->
  <line x1="56" y1="600" x2="1604" y2="600" stroke="#262a31" stroke-width="1"/>
  <text x="56" y="628" font-size="12" fill="#b4bac4">
    green-dashed = async-event (publish)   ·   info-blue solid = topic → consumer fan-out   ·   red-dashed = error-path to DLQ
  </text>
  <text x="56" y="650" font-size="11" font-style="italic" fill="#9aa0ac"
        font-family="'Roboto Serif', ui-serif, Georgia, serif">Read left → right · partitioning is on hash(order_id) so events for one order land on the same partition (ordered per-order).</text>
  <text x="1604" y="688" text-anchor="end" font-size="11" fill="#50545d" font-variant-numeric="tabular-nums">
    OrderFlow · event-flow · diagram skill v2.0.1 · 2026-05
  </text>
</svg>
