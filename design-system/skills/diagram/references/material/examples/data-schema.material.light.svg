  <text x="60" y="772" font-size="12" fill="#3a3f47"><tspan font-weight="600" fill="#04060a">Indigo dots</tspan> mark primary keys · <tspan font-weight="600" fill="#04060a">light-indigo dots</tspan> mark foreign keys · italic labels on arrows show the FK column and cardinality.</text>
  <text x="60" y="792" font-size="12" fill="#3a3f47">Submission is the central aggregate — Document, Verdict, and AuditEvent are all owned by it. Verdict is 1:1 because a run yields exactly one final scored outcome.</text>
  <text x="60" y="820" font-size="11" font-style="italic" fill="#4d5159">All writes append to audit_event in the same transaction · the verdict row is signed and content-addressed by sha256.</text>
  <text x="60" y="850" font-size="10" font-family="monospace" fill="#6f7480">14 indexes total · 3 unique constraints · row-level security enforced via tenant_id on every read</text>
</svg>