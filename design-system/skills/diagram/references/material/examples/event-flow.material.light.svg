  <line x1="60" y1="568" x2="1600" y2="568" stroke="#d2cdc0"></line>
  <text x="60" y="596" font-size="11" font-weight="600" fill="#4d5159" letter-spacing="1.6">DEAD-LETTER · RETRY</text>
  <text x="60" y="620" font-size="12" fill="#3a3f47">Subscribers retry 5× with exponential backoff. On final failure the message moves to a DLQ topic (<tspan font-family="monospace" fill="#04060a">vet.dlq</tspan>) and PagerDuty fires.</text>
  <text x="60" y="640" font-size="12" fill="#3a3f47">Audit Logger never DLQs — it always succeeds because it writes to the same Postgres transaction as the producer.</text>
  <text x="60" y="668" font-size="11" font-style="italic" fill="#4d5159">Read left-to-right · dashed indigo lines are async event flows · the animated dots follow the highest-traffic path (vet.completed fan-out).</text>
