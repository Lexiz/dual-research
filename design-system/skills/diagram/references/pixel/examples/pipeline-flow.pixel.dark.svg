<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 680" font-family="Inter, system-ui, -apple-system, sans-serif">
  <desc>OrderFlow worked example, dark mode. Pipeline flow · 5 left-to-right stages from order intake through to shipment. ViewBox 1660x680. Composes stage.numbered-token, card.primary heroes in categorical dark surfaces, card.reference typed-output sub-row, and one bounded dashed repair turn.</desc>

  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.08"></feDropShadow>
    </filter>
    <filter id="cardShadowDark" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"></feDropShadow>
    </filter>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"></stop><stop offset="100%" stop-color="#14141a"></stop>
    </linearGradient>
    <linearGradient id="surfacePrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7785d4"></stop><stop offset="100%" stop-color="#4d5db0"></stop>
    </linearGradient>
    <linearGradient id="surfaceNeutral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a40"></stop><stop offset="100%" stop-color="#28282d"></stop>
    </linearGradient>
    <linearGradient id="surfaceSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d6b80"></stop><stop offset="100%" stop-color="#3d4858"></stop>
    </linearGradient>
    <linearGradient id="surfaceSecure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d8058"></stop><stop offset="100%" stop-color="#2a6042"></stop>
    </linearGradient>

    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7785d4"></path>
    </marker>
    <marker id="arrowAccentSm" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#7785d4"></path>
    </marker>
    <marker id="arrowGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a7873"></path>
    </marker>
  </defs>

  <rect width="1660" height="680" fill="url(#bgGrad)"></rect>

  <text x="830" y="56" text-anchor="middle" font-size="24" font-weight="600" fill="#ebebe5" letter-spacing="-0.3">OrderFlow · Order Pipeline</text>
  <text x="830" y="80" text-anchor="middle" font-size="13" fill="#9a988f">From intake through to shipment · five typed stages · p99 &lt; 1.2 s</text>

  <!-- stage tokens -->
  <g transform="translate(180, 140)">
    <circle r="18" fill="#7785d4"></circle>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
    <text x="0" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#7a7873" letter-spacing="2">STAGE 1</text>
    <text x="0" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebe5">Intake</text>
  </g>

  <g transform="translate(500, 140)">
    <circle r="18" fill="#7785d4"></circle>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
    <text x="0" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#7a7873" letter-spacing="2">STAGE 2</text>
    <text x="0" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebe5">Validate</text>
  </g>

  <g transform="translate(820, 140)">
    <circle r="18" fill="#7785d4"></circle>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
    <text x="0" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#7a7873" letter-spacing="2">STAGE 3</text>
    <text x="0" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebe5">Reserve</text>
  </g>

  <g transform="translate(1140, 140)">
    <circle r="18" fill="#7785d4"></circle>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
    <text x="0" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#7a7873" letter-spacing="2">STAGE 4</text>
    <text x="0" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebe5">Settle</text>
  </g>

  <g transform="translate(1460, 140)">
    <circle r="18" fill="#7785d4"></circle>
    <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>
    <text x="0" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#7a7873" letter-spacing="2">STAGE 5</text>
    <text x="0" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#ebebe5">Ship</text>
  </g>

  <!-- Stage 1: Order API (raised dark neutral, the lightest hero in dark) -->
  <rect x="60" y="226" width="240" height="120" rx="14" fill="#252531" stroke="#2e2e3a" filter="url(#cardShadow)"></rect>
  <g transform="translate(86, 268)">
    <rect x="-12" y="-10" width="24" height="20" rx="3" fill="none" stroke="#ebebe5" stroke-width="1.6"></rect>
    <path d="M-6,-10 L-6,-4 L6,-4 L6,-10" fill="none" stroke="#ebebe5" stroke-width="1.6"></path>
    <line x1="-7" y1="2" x2="7" y2="2" stroke="#ebebe5" stroke-width="1.4"></line>
    <line x1="-7" y1="6" x2="3" y2="6" stroke="#ebebe5" stroke-width="1.4"></line>
  </g>
  <text x="118" y="260" font-size="14" font-weight="600" fill="#ebebe5">Order API</text>
  <text x="118" y="278" font-size="11" fill="#c4c2bc">REST gateway · public ingress</text>
  <line x1="80" y1="294" x2="280" y2="294" stroke="#2e2e3a"></line>
  <text x="80" y="314" font-size="11" fill="#c4c2bc">schema check · idempotency-key</text>
  <text x="80" y="332" font-size="10" font-style="italic" fill="#9a988f">dedup on order_ref · 24h window</text>

  <!-- Stage 2: Catalog Service -->
  <rect x="380" y="226" width="240" height="120" rx="14" fill="url(#surfaceSlate)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(406, 268)">
    <rect x="-12" y="-10" width="24" height="20" rx="3" fill="rgba(255,255,255,0.18)"></rect>
    <path d="M-8,-4 L-2,-4 L-2,2 L8,2" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"></path>
    <circle cx="-8" cy="-4" r="2" fill="rgba(255,255,255,0.95)"></circle>
    <circle cx="8" cy="2" r="2" fill="rgba(255,255,255,0.95)"></circle>
    <path d="M-7,7 L7,7" stroke="rgba(255,255,255,0.7)" stroke-width="1.2"></path>
  </g>
  <text x="438" y="260" font-size="14" font-weight="600" fill="white">Catalog Service</text>
  <text x="438" y="278" font-size="11" fill="rgba(255,255,255,0.7)">SKU lookup · live pricing</text>
  <line x1="400" y1="294" x2="600" y2="294" stroke="rgba(255,255,255,0.18)"></line>
  <text x="400" y="314" font-size="11" fill="rgba(255,255,255,0.92)">resolves SKU + applies tax</text>
  <text x="400" y="332" font-size="10" font-style="italic" fill="rgba(255,255,255,0.55)">price quote valid for 90 s</text>

  <!-- Stage 3: Inventory Service (primary indigo hero) -->
  <rect x="700" y="226" width="240" height="120" rx="14" fill="url(#surfacePrimary)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(726, 268)">
    <rect x="-12" y="-10" width="24" height="20" rx="3" fill="rgba(255,255,255,0.18)"></rect>
    <line x1="-12" y1="-3" x2="12" y2="-3" stroke="rgba(255,255,255,0.7)" stroke-width="1"></line>
    <line x1="-12" y1="3" x2="12" y2="3" stroke="rgba(255,255,255,0.7)" stroke-width="1"></line>
    <circle cx="-7" cy="-7" r="1.4" fill="rgba(255,255,255,0.95)"></circle>
    <circle cx="-7" cy="0" r="1.4" fill="rgba(255,255,255,0.95)"></circle>
    <circle cx="-7" cy="7" r="1.4" fill="rgba(255,255,255,0.95)"></circle>
  </g>
  <text x="758" y="260" font-size="14" font-weight="600" fill="white">Inventory Service</text>
  <text x="758" y="278" font-size="11" fill="rgba(255,255,255,0.7)">stock-hold orchestrator</text>
  <line x1="720" y1="294" x2="920" y2="294" stroke="rgba(255,255,255,0.18)"></line>
  <text x="720" y="314" font-size="11" fill="rgba(255,255,255,0.92)">soft-reserve units · TTL 10 m</text>
  <text x="720" y="332" font-size="10" font-style="italic" fill="rgba(255,255,255,0.55)">releases hold on cancel</text>
  <circle cx="922" cy="244" r="5" fill="#5aad80"></circle>

  <!-- Stage 4: Payment Service (neutral dark) -->
  <rect x="1020" y="226" width="240" height="120" rx="14" fill="url(#surfaceNeutral)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(1046, 268)">
    <rect x="-12" y="-8" width="24" height="16" rx="2" fill="rgba(255,255,255,0.18)"></rect>
    <line x1="-12" y1="-3" x2="12" y2="-3" stroke="rgba(255,255,255,0.7)" stroke-width="1"></line>
    <rect x="-8" y="2" width="6" height="3" rx="0.6" fill="rgba(255,255,255,0.85)"></rect>
    <rect x="2" y="2" width="8" height="3" rx="0.6" fill="rgba(255,255,255,0.5)"></rect>
  </g>
  <text x="1078" y="260" font-size="14" font-weight="600" fill="white">Payment Service</text>
  <text x="1078" y="278" font-size="11" fill="rgba(255,255,255,0.7)">auth + capture via Stripe</text>
  <line x1="1040" y1="294" x2="1240" y2="294" stroke="rgba(255,255,255,0.18)"></line>
  <text x="1040" y="314" font-size="11" fill="rgba(255,255,255,0.92)">SCA / 3-D Secure when needed</text>
  <text x="1040" y="332" font-size="10" font-style="italic" fill="rgba(255,255,255,0.55)">refund path on cancel · idempotent</text>

  <!-- Stage 5: Fulfilment + Notify (secure green) -->
  <rect x="1340" y="226" width="240" height="120" rx="14" fill="url(#surfaceSecure)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(1366, 268)">
    <rect x="-12" y="-6" width="20" height="14" rx="2" fill="rgba(255,255,255,0.18)"></rect>
    <rect x="8" y="-2" width="6" height="10" rx="1.5" fill="rgba(255,255,255,0.18)"></rect>
    <circle cx="-7" cy="9" r="2.5" fill="rgba(255,255,255,0.85)"></circle>
    <circle cx="9" cy="9" r="2.5" fill="rgba(255,255,255,0.85)"></circle>
  </g>
  <text x="1398" y="260" font-size="14" font-weight="600" fill="white">Fulfilment + Notify</text>
  <text x="1398" y="278" font-size="11" fill="rgba(255,255,255,0.7)">pick · pack · dispatch · alert</text>
  <line x1="1360" y1="294" x2="1560" y2="294" stroke="rgba(255,255,255,0.18)"></line>
  <text x="1360" y="314" font-size="11" fill="rgba(255,255,255,0.92)">email + SMS via SendGrid · Twilio</text>
  <text x="1360" y="332" font-size="10" font-style="italic" fill="rgba(255,255,255,0.55)">tracking-link async on label print</text>

  <!-- inter-stage arrows -->
  <path d="M 308 286 L 376 286" stroke="#7785d4" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="342" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#7785d4" letter-spacing="1">DRAFT</text>

  <path d="M 628 286 L 696 286" stroke="#7785d4" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="662" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#7785d4" letter-spacing="1">PRICED</text>

  <path d="M 948 286 L 1016 286" stroke="#7785d4" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="982" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#7785d4" letter-spacing="1">RESERVED</text>

  <path d="M 1268 286 L 1336 286" stroke="#7785d4" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="1302" y="276" text-anchor="middle" font-size="10" font-weight="600" fill="#7785d4" letter-spacing="1">PAID</text>

  <!-- typed output reference sub-row -->
  <text x="180" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#9a988f" letter-spacing="1.6">TYPED OUTPUT</text>
  <rect x="60" y="418" width="240" height="76" rx="10" fill="#1f1f29" stroke="#3a3a47"></rect>
  <text x="80" y="440" font-size="12" font-weight="600" fill="#c4c2bc">OrderDraft</text>
  <line x1="80" y1="452" x2="280" y2="452" stroke="#3a3a47"></line>
  <text x="80" y="468" font-size="10" font-family="monospace" fill="#c4c2bc">order_ref · customer_id</text>
  <text x="80" y="484" font-size="10" font-family="monospace" fill="#c4c2bc">line_items[] · shipping_addr</text>

  <text x="500" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#9a988f" letter-spacing="1.6">TYPED OUTPUT</text>
  <rect x="380" y="418" width="240" height="76" rx="10" fill="#1f1f29" stroke="#3a3a47"></rect>
  <text x="400" y="440" font-size="12" font-weight="600" fill="#c4c2bc">OrderPriced</text>
  <line x1="400" y1="452" x2="600" y2="452" stroke="#3a3a47"></line>
  <text x="400" y="468" font-size="10" font-family="monospace" fill="#c4c2bc">subtotal · tax · currency</text>
  <text x="400" y="484" font-size="10" font-family="monospace" fill="#c4c2bc">price_quote_id · valid_until</text>

  <text x="820" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#9a988f" letter-spacing="1.6">TYPED OUTPUT</text>
  <rect x="700" y="418" width="240" height="76" rx="10" fill="#1f1f29" stroke="#3a3a47"></rect>
  <text x="720" y="440" font-size="12" font-weight="600" fill="#c4c2bc">OrderReserved</text>
  <line x1="720" y1="452" x2="920" y2="452" stroke="#3a3a47"></line>
  <text x="720" y="468" font-size="10" font-family="monospace" fill="#c4c2bc">reservation_id · holds[]</text>
  <text x="720" y="484" font-size="10" font-family="monospace" fill="#c4c2bc">expires_at · warehouse_id</text>

  <text x="1140" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#9a988f" letter-spacing="1.6">TYPED OUTPUT</text>
  <rect x="1020" y="418" width="240" height="76" rx="10" fill="#1f1f29" stroke="#3a3a47"></rect>
  <text x="1040" y="440" font-size="12" font-weight="600" fill="#c4c2bc">OrderPaid</text>
  <line x1="1040" y1="452" x2="1240" y2="452" stroke="#3a3a47"></line>
  <text x="1040" y="468" font-size="10" font-family="monospace" fill="#c4c2bc">payment_intent_id · amount</text>
  <text x="1040" y="484" font-size="10" font-family="monospace" fill="#c4c2bc">captured_at · provider_ref</text>

  <text x="1460" y="404" text-anchor="middle" font-size="10" font-weight="600" fill="#9a988f" letter-spacing="1.6">TYPED OUTPUT</text>
  <rect x="1340" y="418" width="240" height="76" rx="10" fill="#1f1f29" stroke="#3a3a47"></rect>
  <text x="1360" y="440" font-size="12" font-weight="600" fill="#c4c2bc">OrderShipped</text>
  <line x1="1360" y1="452" x2="1560" y2="452" stroke="#3a3a47"></line>
  <text x="1360" y="468" font-size="10" font-family="monospace" fill="#c4c2bc">shipment_id · carrier · tracking_no</text>
  <text x="1360" y="484" font-size="10" font-family="monospace" fill="#c4c2bc">notified_via[] · shipped_at</text>

  <!-- repair turn dashed loop: Settle (4) back to Validate (2) on stale price -->
  <path d="M 1140 230 C 1140 188 820 188 500 188" stroke="#7785d4" stroke-width="1.6" stroke-dasharray="6,5" fill="none" marker-end="url(#arrowAccentSm)"></path>
  <g transform="translate(760, 176)">
    <rect width="140" height="22" rx="11" fill="#252531" stroke="#7785d4"></rect>
    <text x="70" y="15" text-anchor="middle" font-size="10" font-weight="600" fill="#7785d4" letter-spacing="0.8">REPRICE LOOP · 1×</text>
  </g>

  <!-- legend -->
  <line x1="60" y1="546" x2="1600" y2="546" stroke="#3a3a47"></line>
  <text x="60" y="572" font-size="11" font-weight="600" fill="#9a988f" letter-spacing="1.6">CONTRACT</text>
  <text x="60" y="596" font-size="12" fill="#c4c2bc">Each stage emits a typed Order event; the next stage refuses anything that fails the schema check.</text>
  <text x="60" y="616" font-size="12" fill="#c4c2bc">The reprice loop is the one feedback edge — Settle re-invokes Validate when a price quote has expired. Bounded to one cycle per order.</text>
  <text x="60" y="644" font-size="11" font-style="italic" fill="#9a988f">Read left-to-right · numbered stages · indigo arrows are typed handoffs · dashed loop is the bounded repair turn.</text>
  <text x="1600" y="644" text-anchor="end" font-size="11" fill="#7a7873" font-variant-numeric="tabular-nums">OrderFlow · pipeline-flow · diagram skill v2.0.1 · 2026-05</text>
</svg>
