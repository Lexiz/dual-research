<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 780" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1a1a18" flood-opacity="0.10"></feDropShadow>
    </filter>
    <filter id="cardShadowDark" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1a1a18" flood-opacity="0.22"></feDropShadow>
    </filter>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f1ea"></stop><stop offset="100%" stop-color="#ece8e0"></stop>
    </linearGradient>
    <linearGradient id="surfacePrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6573c9"></stop><stop offset="100%" stop-color="#3a4a8a"></stop>
    </linearGradient>
    <linearGradient id="surfaceSecure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a5e40"></stop><stop offset="100%" stop-color="#1e4530"></stop>
    </linearGradient>
    <linearGradient id="surfaceSql" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3f52"></stop><stop offset="100%" stop-color="#162e3e"></stop>
    </linearGradient>

    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4f5fb8"></path></marker>
    <marker id="arrowAccentSm" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4f5fb8"></path></marker>
    <marker id="arrowOpen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7" stroke="#4f5fb8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></marker>
    <marker id="arrowGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9e9b95"></path></marker>
  </defs>

  <rect width="1660" height="780" fill="url(#bgGrad)"></rect>

  <text x="830" y="56" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a18" letter-spacing="-0.3">OrderFlow · Checkout · Sequence</text>
  <text x="830" y="80" text-anchor="middle" font-size="13" fill="#706e67">Cart submit through to OAuth-gated 3-D Secure capture and receipt</text>

  <!-- Lane headers (5 lanes, x = 110, 410, 710, 1010, 1310; width 240) -->
  <!-- Lane 1: Shopper -->
  <rect x="110" y="120" width="240" height="56" rx="10" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <g transform="translate(140, 148)">
    <circle cx="0" cy="-5" r="5" fill="#1a1a18"></circle>
    <path d="M-10,11 Q-10,3 0,3 Q10,3 10,11 Z" fill="#1a1a18"></path>
  </g>
  <text x="180" y="142" font-size="13" font-weight="600" fill="#1a1a18">Shopper</text>
  <text x="180" y="158" font-size="10" fill="#706e67">external · web + iOS</text>

  <!-- Lane 2: Web app -->
  <rect x="410" y="120" width="240" height="56" rx="10" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <g transform="translate(440, 148)">
    <rect x="-13" y="-10" width="26" height="20" rx="2.5" fill="#1a1a18"></rect>
    <rect x="-13" y="-10" width="26" height="6" rx="2.5" fill="rgba(0,0,0,0.35)"></rect>
    <circle cx="-9" cy="-7" r="1" fill="#5aad80"></circle>
    <circle cx="-5" cy="-7" r="1" fill="#d4a64a"></circle>
    <rect x="-9" y="-1" width="20" height="2" rx="1" fill="rgba(255,255,255,0.45)"></rect>
    <rect x="-9" y="3" width="14" height="2" rx="1" fill="rgba(255,255,255,0.45)"></rect>
  </g>
  <text x="480" y="142" font-size="13" font-weight="600" fill="#1a1a18">Web app</text>
  <text x="480" y="158" font-size="10" fill="#706e67">storefront · React</text>

  <!-- Lane 3: Order API (primary surface) -->
  <rect x="710" y="120" width="240" height="56" rx="10" fill="url(#surfacePrimary)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(740, 148)">
    <path d="M-12,8 L-12,-2 Q-12,-10 0,-12 Q12,-10 12,-2 L12,8 Z" fill="rgba(255,255,255,0.18)"></path>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"></line>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="rgba(255,255,255,0.85)" stroke-width="1.4"></line>
  </g>
  <text x="780" y="142" font-size="13" font-weight="600" fill="white">Order API</text>
  <text x="780" y="158" font-size="10" fill="rgba(255,255,255,0.65)">REST · ingress gateway</text>

  <!-- Lane 4: Payment Service (secure surface) -->
  <rect x="1010" y="120" width="240" height="56" rx="10" fill="url(#surfaceSecure)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(1040, 148)">
    <path d="M0,-12 L11,-7 L11,3 Q11,10 0,13 Q-11,10 -11,3 L-11,-7 Z" fill="rgba(255,255,255,0.85)"></path>
    <path d="M-4,0 L-1,4 L5,-3" stroke="#1a2818" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  </g>
  <text x="1080" y="142" font-size="13" font-weight="600" fill="white">Payment Service</text>
  <text x="1080" y="158" font-size="10" fill="rgba(255,255,255,0.65)">auth · capture · refunds</text>

  <!-- Lane 5: Stripe (sql / external) -->
  <rect x="1310" y="120" width="240" height="56" rx="10" fill="url(#surfaceSql)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(1340, 148)">
    <rect x="-12" y="-9" width="24" height="18" rx="3" fill="rgba(255,255,255,0.85)"></rect>
    <rect x="-12" y="-5" width="24" height="4" fill="rgba(0,0,0,0.45)"></rect>
    <rect x="-8" y="3" width="9" height="3" rx="1" fill="rgba(0,0,0,0.40)"></rect>
  </g>
  <text x="1380" y="142" font-size="13" font-weight="600" fill="white">Stripe</text>
  <text x="1380" y="158" font-size="10" fill="rgba(255,255,255,0.65)">external · SCA / 3DS2</text>

  <!-- Lifelines (dashed) from y=176 down to legend y=708 -->
  <g stroke="#9e9b95" stroke-width="1" stroke-dasharray="3,4" opacity="0.7">
    <line x1="230" y1="176" x2="230" y2="708"></line>
    <line x1="530" y1="176" x2="530" y2="708"></line>
    <line x1="830" y1="176" x2="830" y2="708"></line>
    <line x1="1130" y1="176" x2="1130" y2="708"></line>
    <line x1="1430" y1="176" x2="1430" y2="708"></line>
  </g>

  <!-- Activation boxes (solid surface overlays).
       Order API busy: row2 → row8 (y 252 → 596) = h 344
       Payment Service busy: row3 → row8 (y 308 → 596) = h 288
       Stripe busy: row4 → row5 (y 364 → 444) plus row7 → row8 (508 → 596) -->
  <rect x="822" y="252" width="16" height="344" fill="url(#surfacePrimary)" opacity="0.92"></rect>
  <rect x="1122" y="308" width="16" height="288" fill="url(#surfaceSecure)" opacity="0.92"></rect>
  <rect x="1422" y="364" width="16" height="88" fill="url(#surfaceSql)" opacity="0.92"></rect>
  <rect x="1422" y="508" width="16" height="88" fill="url(#surfaceSql)" opacity="0.92"></rect>

  <!-- Row 1: Shopper → Web app · checkout(cart) [y=216] -->
  <line x1="230" y1="216" x2="522" y2="216" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="376" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">CHECKOUT(CART)</text>
  <text x="376" y="232" text-anchor="middle" font-size="9" font-style="italic" fill="#706e67">tap "Pay" · 1 click</text>

  <!-- Row 2: Web app → Order API · POST /orders [y=272] -->
  <line x1="530" y1="272" x2="822" y2="272" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="676" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">POST /ORDERS</text>
  <text x="676" y="288" text-anchor="middle" font-size="9" font-style="italic" fill="#706e67">{ line_items, address, idempotency_key }</text>

  <!-- Row 3: Order API → Payment Service · charge() [y=328] -->
  <line x1="838" y1="328" x2="1122" y2="328" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="980" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">CHARGE(ORDER_ID, AMOUNT)</text>
  <text x="980" y="344" text-anchor="middle" font-size="9" font-style="italic" fill="#706e67">gRPC · order-svc → payment-svc</text>

  <!-- Row 4: Payment Service → Stripe · POST /payment_intents [y=384] -->
  <line x1="1138" y1="384" x2="1422" y2="384" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="1280" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">POST /PAYMENT_INTENTS</text>
  <text x="1280" y="400" text-anchor="middle" font-size="9" font-style="italic" fill="#706e67">capture_method=automatic · 3ds=required</text>

  <!-- Row 5: Stripe → Shopper · 3DS challenge (async return, long arc) [y=444] -->
  <path d="M 1422 444 Q 830 472 230 460" stroke="#9e9b95" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"></path>
  <text x="826" y="468" text-anchor="middle" font-size="10" font-weight="600" fill="#706e67" letter-spacing="1">3-D SECURE CHALLENGE</text>
  <text x="826" y="488" text-anchor="middle" font-size="9" font-style="italic" fill="#9e9b95">redirect · issuer-hosted page · OOB push</text>

  <!-- Row 6: Shopper → Stripe · authenticates [y=508] -->
  <line x1="230" y1="508" x2="1422" y2="508" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
  <text x="826" y="500" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">AUTHENTICATES (biometric · OTP)</text>

  <!-- Row 7: Stripe → Payment Service · webhook (async-event) [y=552] -->
  <line x1="1422" y1="552" x2="1138" y2="552" stroke="#4f5fb8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"></line>
  <text x="1280" y="544" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">PAYMENT_INTENT.SUCCEEDED</text>
  <text x="1280" y="568" text-anchor="middle" font-size="9" font-style="italic" fill="#706e67">webhook · async-event · signed</text>

  <!-- Row 8: Payment Service → Order API · capture confirmed (return) [y=596] -->
  <line x1="1122" y1="596" x2="838" y2="596" stroke="#4f5fb8" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"></line>
  <text x="980" y="588" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">200 · CAPTURE CONFIRMED</text>

  <!-- Row 9: Order API → Web app · 200 OK { order_id, paid } (return) [y=636] -->
  <line x1="822" y1="636" x2="530" y2="636" stroke="#4f5fb8" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"></line>
  <text x="676" y="628" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">200 OK · { ORDER_ID, STATUS:PAID }</text>

  <!-- Row 10: Web app → Shopper · receipt + tracking link [y=676] -->
  <line x1="522" y1="676" x2="230" y2="676" stroke="#4f5fb8" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowOpen)"></line>
  <text x="376" y="668" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">RECEIPT + TRACKING LINK</text>

  <!-- Side note callout -->
  <rect x="40" y="392" width="170" height="78" rx="8" fill="#fffdf7" stroke="#d4a64a" filter="url(#cardShadow)" opacity="0.95"></rect>
  <text x="52" y="410" font-size="9" font-weight="600" fill="#7a5a1a" letter-spacing="1">NOTE</text>
  <text x="52" y="428" font-size="11" fill="#4a4845">3DS frictionless path</text>
  <text x="52" y="444" font-size="11" fill="#4a4845">skips rows 5–6 entirely;</text>
  <text x="52" y="460" font-size="11" fill="#4a4845">webhook fires &lt; 1.2 s.</text>

  <!-- Legend -->
  <line x1="60" y1="724" x2="1600" y2="724" stroke="#ddd5c6"></line>

  <g transform="translate(60, 748)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#4f5fb8" stroke-width="1.8" marker-end="url(#arrowAccent)"></line>
    <text x="44" y="3" font-size="11" fill="#4a4845">sync-call</text>

    <line x1="120" y1="0" x2="156" y2="0" stroke="#4f5fb8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"></line>
    <text x="164" y="3" font-size="11" fill="#4a4845">async-event</text>

    <line x1="252" y1="0" x2="288" y2="0" stroke="#4f5fb8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrowOpen)"></line>
    <text x="296" y="3" font-size="11" fill="#4a4845">return</text>

    <rect x="354" y="-6" width="10" height="12" fill="url(#surfacePrimary)" opacity="0.92"></rect>
    <text x="370" y="3" font-size="11" fill="#4a4845">activation box (actor busy)</text>
  </g>
  <text x="1600" y="751" text-anchor="end" font-size="11" font-style="italic" fill="#706e67">OrderFlow · sequence · diagram skill v2.0.1 · 2026-05</text>
</svg>
