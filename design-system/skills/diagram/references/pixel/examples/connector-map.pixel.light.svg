<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 760" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1a1a18" flood-opacity="0.10"></feDropShadow>
    </filter>
    <filter id="cardShadowDark" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1a1a18" flood-opacity="0.22"></feDropShadow>
    </filter>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f1ea"></stop><stop offset="100%" stop-color="#ece8e0"></stop>
    </linearGradient>
    <linearGradient id="surfacePrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6573c9"></stop><stop offset="100%" stop-color="#3a4a8a"></stop>
    </linearGradient>

    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#4f5fb8"></path></marker>
    <marker id="arrowAccentSm" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4f5fb8"></path></marker>
  </defs>

  <rect width="1660" height="760" fill="url(#bgGrad)"></rect>

  <text x="830" y="48" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a18" letter-spacing="-0.3">OrderFlow · Connector Map</text>
  <text x="830" y="72" text-anchor="middle" font-size="13" fill="#706e67">One ingress · 8 third-party integrations · two concentric rings by traffic class</text>

  <!-- ring guides (faint, decorative) -->
  <circle cx="830" cy="370" r="285" fill="none" stroke="#d6d0c2" stroke-dasharray="2,5" opacity="0.55"></circle>
  <circle cx="830" cy="370" r="470" fill="none" stroke="#d6d0c2" stroke-dasharray="2,5" opacity="0.4"></circle>
  <text x="830" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#9e9b95" letter-spacing="2">OUTER RING · TELEMETRY &amp; ADMIN</text>
  <text x="830" y="200" text-anchor="middle" font-size="9" font-weight="600" fill="#9e9b95" letter-spacing="2">INNER RING · PRIMARY INTEGRATIONS</text>

  <!-- ===== HUB (center) ===== -->
  <rect x="670" y="290" width="320" height="160" rx="16" fill="url(#surfacePrimary)" filter="url(#cardShadowDark)"></rect>
  <g transform="translate(706, 350)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.8"></circle>
    <circle cx="0" cy="0" r="3.5" fill="rgba(255,255,255,0.92)"></circle>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="rgba(255,255,255,0.92)" stroke-width="1.6"></line>
    <path d="M0,-22 Q-13,0 0,22" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6"></path>
    <path d="M0,-22 Q13,0 0,22" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.6"></path>
  </g>
  <text x="746" y="342" font-size="20" font-weight="600" fill="white">OrderFlow API</text>
  <text x="746" y="364" font-size="12" fill="rgba(255,255,255,0.78)">single ingress · v3.2</text>
  <line x1="690" y1="386" x2="970" y2="386" stroke="rgba(255,255,255,0.20)"></line>
  <text x="690" y="406" font-size="10" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="1.6">INGRESS</text>
  <text x="690" y="426" font-size="12" fill="rgba(255,255,255,0.92)" font-variant-numeric="tabular-nums">api.orderflow.io · mTLS · per-tenant</text>

  <circle cx="966" cy="312" r="5.5" fill="#5aad80"></circle>
  <text x="956" y="316" text-anchor="end" font-size="10" font-weight="600" fill="rgba(255,255,255,0.82)" letter-spacing="1.2">LIVE</text>

  <!-- ===== INNER RING (4 spokes, 180x80) ===== -->
  <!-- Stripe (sql tint) - top-left -->
  <rect x="340" y="220" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="356" y="240" width="40" height="40" rx="8" fill="#1e3f52"></rect>
  <text x="376" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="white">ST</text>
  <text x="408" y="252" font-size="13" font-weight="600" fill="#1a1a18">Stripe</text>
  <text x="408" y="270" font-size="10" fill="#4a4845">payments</text>
  <text x="408" y="286" font-size="10" font-style="italic" fill="#706e67">cards · ACH · 3DS2</text>

  <!-- PayPal (sql tint) - top-right -->
  <rect x="1140" y="220" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="1156" y="240" width="40" height="40" rx="8" fill="#1e3f52"></rect>
  <text x="1176" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="white">PP</text>
  <text x="1208" y="252" font-size="13" font-weight="600" fill="#1a1a18">PayPal</text>
  <text x="1208" y="270" font-size="10" fill="#4a4845">alt payments</text>
  <text x="1208" y="286" font-size="10" font-style="italic" fill="#706e67">Express Checkout</text>

  <!-- SendGrid (store tint) - bottom-left -->
  <rect x="340" y="440" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="356" y="460" width="40" height="40" rx="8" fill="#5e3f1c"></rect>
  <text x="376" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="white">SG</text>
  <text x="408" y="472" font-size="13" font-weight="600" fill="#1a1a18">SendGrid</text>
  <text x="408" y="490" font-size="10" fill="#4a4845">email</text>
  <text x="408" y="506" font-size="10" font-style="italic" fill="#706e67">receipts · shipping</text>

  <!-- Salesforce (sql tint) - bottom-right - 2-way -->
  <rect x="1140" y="440" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="1156" y="460" width="40" height="40" rx="8" fill="#1e3f52"></rect>
  <text x="1176" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="white">SF</text>
  <text x="1208" y="472" font-size="13" font-weight="600" fill="#1a1a18">Salesforce</text>
  <text x="1208" y="490" font-size="10" fill="#4a4845">CRM</text>
  <text x="1208" y="506" font-size="10" font-style="italic" fill="#706e67">B2B roster · 2-way</text>

  <!-- ===== OUTER RING (4 spokes) ===== -->
  <!-- Auth0 (secure tint) - far top-left - 2-way -->
  <rect x="80" y="120" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="96" y="140" width="40" height="40" rx="8" fill="#1e4530"></rect>
  <text x="116" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="white">A0</text>
  <text x="148" y="152" font-size="13" font-weight="600" fill="#1a1a18">Auth0</text>
  <text x="148" y="170" font-size="10" fill="#4a4845">identity</text>
  <text x="148" y="186" font-size="10" font-style="italic" fill="#706e67">OIDC · MFA on admins</text>

  <!-- Snowflake (slate tint) - far top-right -->
  <rect x="1400" y="120" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="1416" y="140" width="40" height="40" rx="8" fill="#3a3f47"></rect>
  <text x="1436" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="white">SN</text>
  <text x="1468" y="152" font-size="13" font-weight="600" fill="#1a1a18">Snowflake</text>
  <text x="1468" y="170" font-size="10" fill="#4a4845">warehouse</text>
  <text x="1468" y="186" font-size="10" font-style="italic" fill="#706e67">Snowpipe · BI</text>

  <!-- Twilio (store tint) - far bottom-left -->
  <rect x="80" y="540" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="96" y="560" width="40" height="40" rx="8" fill="#5e3f1c"></rect>
  <text x="116" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="white">TW</text>
  <text x="148" y="572" font-size="13" font-weight="600" fill="#1a1a18">Twilio</text>
  <text x="148" y="590" font-size="10" fill="#4a4845">SMS</text>
  <text x="148" y="606" font-size="10" font-style="italic" fill="#706e67">shipping · MFA codes</text>

  <!-- Sentry (cache tint) - far bottom-right -->
  <rect x="1400" y="540" width="180" height="80" rx="12" fill="white" stroke="#e8e2d8" filter="url(#cardShadow)"></rect>
  <rect x="1416" y="560" width="40" height="40" rx="8" fill="#7a3a1c"></rect>
  <text x="1436" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="white">SE</text>
  <text x="1468" y="572" font-size="13" font-weight="600" fill="#1a1a18">Sentry</text>
  <text x="1468" y="590" font-size="10" fill="#4a4845">telemetry</text>
  <text x="1468" y="606" font-size="10" font-style="italic" fill="#706e67">errors · release health</text>

  <!-- ===== ARROWS hub ↔ spokes ===== -->
  <!-- Inner: Stripe (1-way, REST) -->
  <path d="M 665 332 L 525 270" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="600" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">REST</text>

  <!-- Inner: PayPal (1-way, REST) -->
  <path d="M 995 332 L 1135 270" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="1062" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">REST</text>

  <!-- Inner: SendGrid (1-way, webhook) -->
  <path d="M 665 408 L 525 470" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="595" y="466" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">WEBHOOK</text>

  <!-- Inner: Salesforce (2-way, REST) -->
  <path d="M 995 408 L 1135 470" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"></path>
  <text x="1067" y="466" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">REST · 2-WAY</text>

  <!-- Outer: Auth0 (2-way, OIDC) - curves above inner ring -->
  <path d="M 750 290 Q 470 120 265 180" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)" marker-start="url(#arrowAccentSm)"></path>
  <text x="475" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">OIDC · 2-WAY</text>

  <!-- Outer: Snowflake (1-way, gRPC/Snowpipe) - curves above inner ring -->
  <path d="M 910 290 Q 1190 120 1395 180" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="1185" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">gRPC</text>

  <!-- Outer: Twilio (1-way, REST) - curves below inner ring -->
  <path d="M 750 450 Q 470 632 265 560" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="475" y="624" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">REST</text>

  <!-- Outer: Sentry (1-way, HTTPS) - curves below inner ring -->
  <path d="M 910 450 Q 1190 632 1395 560" stroke="#4f5fb8" stroke-width="1.8" fill="none" marker-end="url(#arrowAccent)"></path>
  <text x="1185" y="624" text-anchor="middle" font-size="10" font-weight="600" fill="#4f5fb8" letter-spacing="1">HTTPS</text>

  <!-- legend -->
  <line x1="60" y1="664" x2="1600" y2="664" stroke="#ddd5c6"></line>
  <text x="60" y="692" font-size="11" font-weight="600" fill="#706e67" letter-spacing="1.6">CONNECTOR MAP</text>
  <text x="60" y="714" font-size="12" fill="#4a4845">Hub-and-spoke · 6 one-way + 2 two-way arrows (Salesforce, Auth0). Monogram tile colour encodes data category — sql · store · slate · cache · secure.</text>
  <text x="60" y="734" font-size="11" font-style="italic" fill="#706e67">Read center-out · the inner ring is sync payment + comms; the outer ring is identity, warehouse, and telemetry.</text>
  <text x="1600" y="734" text-anchor="end" font-size="10" fill="#9e9b95" font-variant-numeric="tabular-nums">OrderFlow · connector-map · diagram skill v2.0.1 · 2026-05</text>
</svg>
