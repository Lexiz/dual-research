[project]
name = "dual-research"
version = "1.39.2"
description = "Two-agent (Claude + GPT) research convergence orchestrator with real-time monitoring UI."
readme = "README.md"
authors = [
    { name = "alex lisitzky", email = "alex_lisitzky@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.102.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "sse-starlette>=2.1",
    "supabase>=2.9",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
]

[project.scripts]
dual-research = "dual_research.cli:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
