<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1080" font-family="Inter, system-ui, -apple-system, sans-serif">

  <!-- ================= DEFS ================= -->
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1a1a18" flood-opacity="0.10"/>
    </filter>
    <filter id="cardShadowDark" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1a1a18" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f1ea"/><stop offset="100%" stop-color="#ece8e0"/>
    </linearGradient>
    <linearGradient id="surfaceNeutral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#252521"/><stop offset="100%" stop-color="#1a1a18"/>
    </linearGradient>
    <marker id="arrowIn" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L0,8 L7,4 z" fill="#4f5fb8"/></marker>
    <marker id="arrowOut" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L0,8 L7,4 z" fill="#4f5fb8"/></marker>
  </defs>

  <rect width="1660" height="1080" fill="url(#bgGrad)"/>

  <!-- ════════════════════════════════ TITLE ════════════════════════════════════ -->
  <text x="830" y="56" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a18" letter-spacing="-0.3">Phase contract · inputs and outputs</text>
  <text x="830" y="82" text-anchor="middle" font-size="13" fill="#706e67">A single generic phase shape · which rows can appear, which are conditional · spec 0121 § 5</text>

  <!-- ============== COLUMN HEADERS ============== -->
  <text x="250" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#9e9b95" letter-spacing="2">INPUTS · LEFT EDGE</text>
  <text x="830" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#9e9b95" letter-spacing="2">PHASE</text>
  <text x="1410" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#9e9b95" letter-spacing="2">OUTPUTS · RIGHT EDGE</text>

  <!-- ================= PHASE BOX (CENTRAL) ================= -->
  <rect x="470" y="148" width="720" height="820" rx="16" fill="url(#surfaceNeutral)" filter="url(#cardShadowDark)"/>
  <rect x="470" y="148" width="720" height="74" rx="16" fill="rgba(255,255,255,0.04)"/>
  <rect x="470" y="200" width="720" height="22" fill="rgba(255,255,255,0.04)"/>
  <text x="830" y="184" text-anchor="middle" font-size="20" font-weight="600" fill="white"><tspan font-style="italic">Phase &lt;N&gt;</tspan>  —  <tspan font-style="italic" font-family="monospace" fill="#c5cdf0">&lt;name&gt;</tspan></text>
  <text x="830" y="208" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="1.2">generic phase shape · all rows shown · conditional rows dashed</text>
  <line x1="490" y1="232" x2="1170" y2="232" stroke="rgba(255,255,255,0.18)"/>

  <!-- phase-box interior caption -->
  <text x="830" y="258" text-anchor="middle" font-size="10" font-weight="600" fill="rgba(255,255,255,0.55)" letter-spacing="1.8">CONTRACT · WHAT GOES IN, WHAT COMES OUT</text>

  <!-- divider inside box (between input-side and output-side of contract) -->
  <line x1="830" y1="290" x2="830" y2="930" stroke="rgba(255,255,255,0.10)" stroke-dasharray="3,4"/>

  <!-- INPUT SIDE label inside box -->
  <text x="660" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.8">RECEIVES</text>
  <text x="1000" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.8">EMITS</text>

  <!-- inner annotation: per-round mechanics -->
  <text x="660" y="478" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.65)">8 input row types</text>
  <text x="660" y="496" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)" font-style="italic">5 always · 3 round-conditional</text>

  <text x="1000" y="478" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.65)">2 output groups</text>
  <text x="1000" y="496" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)" font-style="italic">per-round turns · agreement (multi-round only)</text>

  <!-- legend inside box, bottom -->
  <text x="830" y="876" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.45)" letter-spacing="1.6">LEGEND</text>
  <g transform="translate(516, 894)">
    <rect width="14" height="14" rx="7" fill="#f5f1ea" stroke="#cfc9c0"/>
    <text x="22" y="11" font-size="10" fill="rgba(255,255,255,0.75)">system</text>
    <rect x="80" width="14" height="14" rx="7" fill="#fbeede" stroke="#d8b890"/>
    <text x="102" y="11" font-size="10" fill="rgba(255,255,255,0.75)">user</text>
    <rect x="148" width="14" height="14" rx="7" fill="#e0eedb" stroke="#7fa67e"/>
    <text x="170" y="11" font-size="10" fill="rgba(255,255,255,0.75)">agreement</text>
    <rect x="240" width="14" height="14" rx="7" fill="#f4e5d5" stroke="#d4a574"/>
    <text x="262" y="11" font-size="10" fill="rgba(255,255,255,0.75)">claude (sable)</text>
    <rect x="358" width="14" height="14" rx="7" fill="#e1efeb" stroke="#7cc4b8"/>
    <text x="380" y="11" font-size="10" fill="rgba(255,255,255,0.75)">openai (sage)</text>
    <rect x="478" width="14" height="14" rx="7" fill="#ece8e0" stroke="#9e9b95" stroke-dasharray="3,2"/>
    <text x="500" y="11" font-size="10" fill="rgba(255,255,255,0.75)">conditional</text>
  </g>

  <!-- ════════════════════════════════ INPUT ROWS ════════════════════════════════════ -->
  <!-- Each row: pill at x=70 width=360, vertically stacked, arrow exits right edge of pill to phase box (x=470) -->

  <!-- ROW 1: system.preamble -->
  <g transform="translate(70, 168)">
    <rect width="360" height="48" rx="10" fill="#f5f1ea" stroke="#cfc9c0" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#9e9b95" letter-spacing="1.4">SYSTEM</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1a1a18" font-family="monospace">system.preamble</text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#cfc9c0"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#706e67" letter-spacing="1">ALWAYS</text>
  </g>
  <path d="M 430 192 L 466 192" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 2: system.task.<phase> -->
  <g transform="translate(70, 232)">
    <rect width="360" height="48" rx="10" fill="#f5f1ea" stroke="#cfc9c0" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#9e9b95" letter-spacing="1.4">SYSTEM</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1a1a18" font-family="monospace">system.task.<tspan font-style="italic" fill="#4f5fb8">&lt;phase&gt;</tspan></text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#cfc9c0"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#706e67" letter-spacing="1">ALWAYS</text>
  </g>
  <path d="M 430 256 L 466 256" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 3: user_prompt (with nested sub-cluster) -->
  <g transform="translate(70, 296)">
    <rect width="360" height="92" rx="10" fill="#fbeede" stroke="#d8b890" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#9e7a4a" letter-spacing="1.4">USER</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#7a5028" font-family="monospace">user_prompt</text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#d8b890"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#7a5028" letter-spacing="1">ALWAYS</text>
    <!-- nested sub-pills -->
    <rect x="14" y="46" width="156" height="20" rx="10" fill="#fff5e6" stroke="#d8b890"/>
    <text x="92" y="60" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a5028" font-family="monospace">.message</text>
    <rect x="176" y="46" width="170" height="20" rx="10" fill="#fff5e6" stroke="#d8b890"/>
    <text x="261" y="60" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7a5028" font-family="monospace">.attachment.<tspan font-style="italic">&lt;id&gt;</tspan></text>
    <text x="14" y="82" font-size="9" font-style="italic" fill="#9e7a4a">composite · one .message + zero-or-more .attachment.&lt;id&gt; sub-artifacts</text>
  </g>
  <path d="M 430 342 L 466 342" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 4: phase<earlier>.agreement.<artifact> -->
  <g transform="translate(70, 404)">
    <rect width="360" height="48" rx="10" fill="#e0eedb" stroke="#7fa67e" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#3d7f5b" letter-spacing="1.4">CARRY-FORWARD · AGREEMENT</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1f4a32" font-family="monospace">phase<tspan font-style="italic">&lt;earlier&gt;</tspan>.agreement.<tspan font-style="italic">&lt;artifact&gt;</tspan></text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#7fa67e"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#3d7f5b" letter-spacing="1">N ROWS</text>
  </g>
  <path d="M 430 428 L 466 428" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 5a: phase<earlier>.claude (sable) -->
  <g transform="translate(70, 468)">
    <rect width="360" height="48" rx="10" fill="#f4e5d5" stroke="#d4a574" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#8a5a2c" letter-spacing="1.4">CARRY-FORWARD · PER-AGENT</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#5e3f1c" font-family="monospace">phase<tspan font-style="italic">&lt;earlier&gt;</tspan>.claude</text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#d4a574"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#8a5a2c" letter-spacing="1">SABLE</text>
  </g>
  <path d="M 430 492 L 466 492" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 5b: phase<earlier>.openai (sage) -->
  <g transform="translate(70, 532)">
    <rect width="360" height="48" rx="10" fill="#e1efeb" stroke="#7cc4b8" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#2f7a6e" letter-spacing="1.4">CARRY-FORWARD · PER-AGENT</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1f4a44" font-family="monospace">phase<tspan font-style="italic">&lt;earlier&gt;</tspan>.openai</text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="none" stroke="#7cc4b8"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="600" fill="#2f7a6e" letter-spacing="1">SAGE</text>
  </g>
  <path d="M 430 556 L 466 556" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 6: prior_turns.phase<N> (dashed, R>=2) -->
  <g transform="translate(70, 596)">
    <rect width="360" height="48" rx="10" fill="#ece8e0" stroke="#9e9b95" stroke-dasharray="4,3" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#706e67" letter-spacing="1.4">ROUND-CONDITIONAL</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#4a4845" font-family="monospace">prior_turns.phase<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan></text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="#eef0fb" stroke="#7785d4"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#3a4a8a" letter-spacing="0.6">R ≥ 2</text>
  </g>
  <path d="M 430 620 L 466 620" stroke="#9e9b95" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 7: ledger.standing_items -->
  <g transform="translate(70, 660)">
    <rect width="360" height="48" rx="10" fill="#ece8e0" stroke="#9e9b95" stroke-dasharray="4,3" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#706e67" letter-spacing="1.4">ROUND-CONDITIONAL</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#4a4845" font-family="monospace">ledger.standing_items</text>
    <rect x="280" y="10" width="68" height="18" rx="9" fill="#eef0fb" stroke="#7785d4"/>
    <text x="314" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#3a4a8a" letter-spacing="0.6">R ≥ 2</text>
  </g>
  <path d="M 430 684 L 466 684" stroke="#9e9b95" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowIn)"/>

  <!-- ROW 8: closeout.request -->
  <g transform="translate(70, 724)">
    <rect width="360" height="48" rx="10" fill="#ece8e0" stroke="#9e9b95" stroke-dasharray="4,3" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#706e67" letter-spacing="1.4">ROUND-CONDITIONAL</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#4a4845" font-family="monospace">closeout.request</text>
    <rect x="272" y="10" width="76" height="18" rx="9" fill="#fff5ef" stroke="#cc6e55"/>
    <text x="310" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#b6552e" letter-spacing="0.6">CLOSEOUT</text>
  </g>
  <path d="M 430 748 L 466 748" stroke="#9e9b95" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowIn)"/>

  <!-- Input column annotation under rows -->
  <text x="250" y="800" text-anchor="middle" font-size="10" fill="#706e67">stacked top → bottom in canonical order</text>
  <text x="250" y="816" text-anchor="middle" font-size="10" fill="#706e67">arrows enter the phase box from each row's right edge</text>

  <!-- ════════════════════════════════ OUTPUT ROWS ════════════════════════════════════ -->
  <!-- Right edge of phase box at x=1190; pills at x=1230, w=360 -->

  <!-- OUTPUT GROUP 1: PER-ROUND TURN ARTIFACTS -->
  <text x="1230" y="320" font-size="10" font-weight="600" fill="#9e9b95" letter-spacing="1.8">PER-ROUND TURN ARTIFACTS</text>
  <text x="1230" y="338" font-size="10" fill="#706e67">one row per agent</text>

  <!-- OUT 1a: phase<N>.claude.r<N> -->
  <g transform="translate(1230, 352)">
    <rect width="360" height="48" rx="10" fill="#f4e5d5" stroke="#d4a574" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#8a5a2c" letter-spacing="1.4">SABLE</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#5e3f1c" font-family="monospace">phase<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan>.claude.r<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan></text>
    <rect x="276" y="10" width="72" height="18" rx="9" fill="#eef0fb" stroke="#7785d4"/>
    <text x="312" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#3a4a8a" letter-spacing="0.6">ROUND N</text>
  </g>
  <path d="M 1194 376 L 1226 376" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowOut)"/>

  <!-- OUT 1b: phase<N>.openai.r<N> -->
  <g transform="translate(1230, 416)">
    <rect width="360" height="48" rx="10" fill="#e1efeb" stroke="#7cc4b8" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#2f7a6e" letter-spacing="1.4">SAGE</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1f4a44" font-family="monospace">phase<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan>.openai.r<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan></text>
    <rect x="276" y="10" width="72" height="18" rx="9" fill="#eef0fb" stroke="#7785d4"/>
    <text x="312" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#3a4a8a" letter-spacing="0.6">ROUND N</text>
  </g>
  <path d="M 1194 440 L 1226 440" stroke="#4f5fb8" stroke-width="1.5" fill="none" marker-end="url(#arrowOut)"/>

  <!-- separator -->
  <line x1="1230" y1="492" x2="1590" y2="492" stroke="#cfc9c0" stroke-dasharray="3,3"/>

  <!-- OUTPUT GROUP 2: AGREEMENT-EMITTED -->
  <text x="1230" y="520" font-size="10" font-weight="600" fill="#9e9b95" letter-spacing="1.8">AGREEMENT-EMITTED</text>
  <text x="1230" y="538" font-size="10" fill="#706e67">multi-round phases only</text>

  <!-- OUT 2: phase<N>.agreement.<artifact> -->
  <g transform="translate(1230, 552)">
    <rect width="360" height="48" rx="10" fill="#e0eedb" stroke="#7fa67e" filter="url(#cardShadow)"/>
    <text x="14" y="18" font-size="9" font-weight="600" fill="#3d7f5b" letter-spacing="1.4">AGREEMENT · OK-GREEN</text>
    <text x="14" y="36" font-size="13" font-weight="600" fill="#1f4a32" font-family="monospace">phase<tspan font-style="italic" fill="#4f5fb8">&lt;N&gt;</tspan>.agreement.<tspan font-style="italic">&lt;artifact&gt;</tspan></text>
    <rect x="268" y="10" width="80" height="18" rx="9" fill="#e0eedb" stroke="#7fa67e"/>
    <text x="308" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#3d7f5b" letter-spacing="0.6">N ROWS</text>
  </g>
  <path d="M 1194 576 L 1226 576" stroke="#3d7f5b" stroke-width="1.5" fill="none" marker-end="url(#arrowOut)"/>

  <!-- annotation under agreement output -->
  <text x="1410" y="620" text-anchor="middle" font-size="10" font-style="italic" fill="#3d7f5b">if multi-round</text>
  <text x="1410" y="636" text-anchor="middle" font-size="9" fill="#706e67">absent in single-round phases</text>

  <!-- Output column annotation -->
  <text x="1410" y="800" text-anchor="middle" font-size="10" fill="#706e67">stacked top → bottom</text>
  <text x="1410" y="816" text-anchor="middle" font-size="10" fill="#706e67">arrows leave the phase box from each row's left edge</text>

  <!-- ════════════════════════════════ CAPTION STRIP ════════════════════════════════════ -->
  <line x1="56" y1="1004" x2="1604" y2="1004" stroke="#ddd5c6"/>
  <text x="830" y="1030" text-anchor="middle" font-size="11" font-style="italic" fill="#706e67">Per-phase variant: see § 5.2 of spec 0121 for which input rows are present in each of P0, P1, P2, P3, P4.</text>
  <text x="830" y="1050" text-anchor="middle" font-size="9" fill="#9e9b95" letter-spacing="1.2">CONTRACT DIAGRAM · not a workflow · arrows show row → phase membership, not runtime sequence</text>

</svg>
