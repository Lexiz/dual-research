<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="880" viewBox="0 0 1660 880" preserveAspectRatio="xMidYMid meet" font-family="Roboto Flex, Roboto, system-ui, -apple-system, sans-serif">

  <!-- ================= DEFS ================= -->
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#04060a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f6"/><stop offset="100%" stop-color="#ece8de"/>
    </linearGradient>
  </defs>

  <!-- ================= CANVAS ================= -->
  <rect width="1660" height="880" fill="url(#bgGrad)"/>

  <!-- ================= TITLE ================= -->
  <text x="830" y="56" text-anchor="middle" font-size="26" font-weight="600" fill="#04060a" letter-spacing="-0.3">Item categories · chip composition reference</text>
  <text x="830" y="82" text-anchor="middle" font-size="13" fill="#4d5159">How to read any chip in a Dual Research conversation · point at a chip in the app, find its card here in seconds</text>

  <!-- ================= SECTION 1 LABEL ================= -->
  <text x="56" y="120" font-size="10" font-weight="600" fill="#6f7480" letter-spacing="2">THE FOUR CATEGORIES · every item raised by an agent is exactly one of these</text>

  <!-- ============================================================ -->
  <!--               TOP REGION · FOUR CATEGORY CARDS               -->
  <!-- ============================================================ -->
  <!-- usable width: 1660 - 56 (left) - 224 (legend column right) = 1380
       4 cards of 320 + 3 gaps of 20 = 1340; center: gutter (1380-1340)/2 = 20
       => first card at x = 56 + 20 = 76
       card y: 140, height: 280 -->

  <!-- ================= CARD 1 · Q · QUESTION ================= -->
  <!-- info bg ~15% over white, info outline #6b9cf0 -->
  <rect x="76" y="140" width="320" height="280" rx="16" fill="white" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <!-- bubble (info-bg over white, info outline) -->
  <circle cx="236" cy="244" r="62" fill="#e3edfb" stroke="#6b9cf0" stroke-width="1.5"/>
  <text x="236" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#6b9cf0" letter-spacing="-2">Q</text>

  <!-- label + sublabel -->
  <text x="236" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#6b9cf0">Question</text>
  <text x="236" y="358" text-anchor="middle" font-size="11" fill="#3a3f47">I don't know; the other agent</text>
  <text x="236" y="373" text-anchor="middle" font-size="11" fill="#3a3f47">does or should research.</text>

  <!-- footer rule + chips -->
  <line x1="96" y1="392" x2="376" y2="392" stroke="#e7e3d9"/>
  <text x="96" y="408" font-size="9" font-weight="600" fill="#6f7480" letter-spacing="1.6">RAISED IN</text>
  <!-- chip cluster centered under the rule -->
  <rect x="178" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="196" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P0</text>
  <rect x="222" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="240" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P2</text>
  <rect x="266" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="284" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P4</text>

  <!-- ================= CARD 2 · D · DISAGREEMENT ================= -->
  <rect x="416" y="140" width="320" height="280" rx="16" fill="white" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <!-- bubble (warn bg, warn outline) -->
  <circle cx="576" cy="244" r="62" fill="#f7ecd9" stroke="#d4a056" stroke-width="1.5"/>
  <text x="576" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#d4a056" letter-spacing="-2">D</text>

  <text x="576" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#d4a056">Disagreement</text>
  <text x="576" y="358" text-anchor="middle" font-size="11" fill="#3a3f47">I hold X; they hold Y;</text>
  <text x="576" y="373" text-anchor="middle" font-size="11" fill="#3a3f47">we differ on substance.</text>

  <line x1="436" y1="392" x2="716" y2="392" stroke="#e7e3d9"/>
  <text x="436" y="408" font-size="9" font-weight="600" fill="#6f7480" letter-spacing="1.6">RAISED IN</text>
  <rect x="518" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="536" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P0</text>
  <rect x="562" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="580" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P2</text>
  <rect x="606" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="624" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P4</text>

  <!-- ================= CARD 3 · I · ISSUE ================= -->
  <rect x="756" y="140" width="320" height="280" rx="16" fill="white" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <!-- bubble (err bg, err outline) -->
  <circle cx="916" cy="244" r="62" fill="#f8e1e1" stroke="#d96a6a" stroke-width="1.5"/>
  <text x="916" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#d96a6a" letter-spacing="-2">I</text>

  <text x="916" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#d96a6a">Issue</text>
  <text x="916" y="358" text-anchor="middle" font-size="11" fill="#3a3f47">The drafted document is</text>
  <text x="916" y="373" text-anchor="middle" font-size="11" fill="#3a3f47">defective in a specific way.</text>

  <line x1="776" y1="392" x2="1056" y2="392" stroke="#e7e3d9"/>
  <text x="776" y="408" font-size="9" font-weight="600" fill="#6f7480" letter-spacing="1.6">RAISED IN</text>
  <rect x="898" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="916" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P4</text>

  <!-- ================= CARD 4 · C · COMMENT ================= -->
  <rect x="1096" y="140" width="320" height="280" rx="16" fill="white" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <!-- bubble (idle bg, idle outline) -->
  <circle cx="1256" cy="244" r="62" fill="#ebedef" stroke="#7d8290" stroke-width="1.5"/>
  <text x="1256" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#7d8290" letter-spacing="-2">C</text>

  <text x="1256" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#7d8290">Comment</text>
  <text x="1256" y="358" text-anchor="middle" font-size="11" fill="#3a3f47">Could be improved in a</text>
  <text x="1256" y="373" text-anchor="middle" font-size="11" fill="#3a3f47">non-defect way.</text>

  <line x1="1116" y1="392" x2="1396" y2="392" stroke="#e7e3d9"/>
  <text x="1116" y="408" font-size="9" font-weight="600" fill="#6f7480" letter-spacing="1.6">RAISED IN</text>
  <rect x="1238" y="398" width="36" height="18" rx="9" fill="#f0ebe3" stroke="#d2cdc0"/>
  <text x="1256" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#3a3f47">P4</text>

  <!-- ================= SECTION DIVIDER ================= -->
  <line x1="56" y1="468" x2="1436" y2="468" stroke="#d2cdc0"/>

  <!-- ================= SECTION 2 LABEL ================= -->
  <text x="56" y="500" font-size="10" font-weight="600" fill="#6f7480" letter-spacing="2">ANATOMY OF A CARD HEADER · slots, left → right</text>

  <!-- ============================================================ -->
  <!--          BOTTOM REGION · CHIP COMPOSITION STRIP              -->
  <!-- ============================================================ -->
  <!-- caption row at y=520, chips at y=556 (chip h=32), strip card from x=76 width=1340 -->

  <!-- strip card background (subtle warm tint, to visually unify the 6 chips as one header) -->
  <rect x="76" y="540" width="1340" height="80" rx="14" fill="#f0ebe3" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <!-- Caption labels ABOVE each chip -->
  <!-- chip x coords + widths:
       1 Claude      x=  100  w= 116  (provider)
       2 turn 3      x=  236  w=  88  (activity)
       3 Q · Quest.  x=  344  w= 162  (category)
       4 raised r2   x=  526  w= 132  (modifier)
       5 Sources 4   x=  678  w= 116  (modifier)
       6 ✓ resolved  x=  814  w= 200  (status)
       gap between chips: 20
       trailing space lets the strip breathe; total used ~ 914 px starting at 100. -->
  <text x="158" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">PROVIDER</text>
  <text x="280" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">ACTIVITY</text>
  <text x="425" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">CATEGORY</text>
  <text x="592" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">MODIFIER</text>
  <text x="736" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">MODIFIER</text>
  <text x="914" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#4d5159" letter-spacing="1.4" font-family="monospace">STATUS</text>

  <!-- ================= CHIP 1 · [Claude] (sable provider) ================= -->
  <rect x="100" y="564" width="116" height="32" rx="16" fill="#d4a574" stroke="#b88955" stroke-width="1"/>
  <!-- brand-mark monogram: small white circle with sable 'C' -->
  <circle cx="118" cy="580" r="9" fill="white"/>
  <text x="118" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#b88955">C</text>
  <text x="135" y="584" font-size="12" font-weight="600" fill="white">Claude</text>

  <!-- separator arrow 1→2 (light chevron) -->
  <path d="M 222 580 L 230 580" stroke="#6f7480" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 2 · [turn 3] (mono neutral) ================= -->
  <rect x="236" y="564" width="88" height="32" rx="16" fill="white" stroke="#d2cdc0"/>
  <text x="280" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#3a3f47">turn 3</text>

  <path d="M 330 580 L 338 580" stroke="#6f7480" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 3 · [Q · Question] (info bubble + label) ================= -->
  <rect x="344" y="564" width="162" height="32" rx="16" fill="#e3edfb" stroke="#6b9cf0"/>
  <circle cx="362" cy="580" r="10" fill="white" stroke="#6b9cf0" stroke-width="1.2"/>
  <text x="362" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#6b9cf0">Q</text>
  <text x="378" y="584" font-size="12" font-weight="600" fill="#3a6cc0">Question</text>

  <path d="M 512 580 L 520 580" stroke="#6f7480" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 4 · [raised in r2] (mono neutral) ================= -->
  <rect x="526" y="564" width="132" height="32" rx="16" fill="white" stroke="#d2cdc0"/>
  <text x="592" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#3a3f47">raised in r2</text>

  <path d="M 664 580 L 672 580" stroke="#6f7480" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 5 · [Sources 4] (neutral) ================= -->
  <rect x="678" y="564" width="116" height="32" rx="16" fill="white" stroke="#d2cdc0"/>
  <text x="736" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#3a3f47">Sources 4</text>

  <path d="M 800 580 L 808 580" stroke="#6f7480" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 6 · [✓ resolved in r4] (ok status) ================= -->
  <rect x="814" y="564" width="200" height="32" rx="16" fill="#dff0e6" stroke="#4ea072"/>
  <!-- check icon -->
  <path d="M 829 580 L 835 586 L 845 574" stroke="#2f7a52" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="853" y="584" font-size="12" font-weight="600" fill="#2f7a52">resolved in r4</text>

  <!-- inline marker def used by chevrons (placed here for compactness) -->
  <defs>
    <marker id="sepArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6f7480"/>
    </marker>
  </defs>

  <!-- ================= RULE (composition) ================= -->
  <text x="746" y="660" text-anchor="middle" font-size="13" font-style="italic" fill="#4d5159">"Provider first. Status last (and never bare). Categories in canonical Q &#8594; D &#8594; I &#8594; C order when multiple appear together."</text>

  <!-- ================= READING NOTES (footer) ================= -->
  <text x="56" y="710" font-size="10" font-weight="600" fill="#6f7480" letter-spacing="2">HOW TO READ</text>
  <text x="56" y="730" font-size="11.5" fill="#3a3f47">Every card in a Dual Research conversation carries a header strip like the one above. The <tspan font-weight="600" fill="#04060a">Provider</tspan> chip identifies which agent posted it; the <tspan font-weight="600" fill="#04060a">Activity</tspan> chip says where in the run it appeared; the</text>
  <text x="56" y="748" font-size="11.5" fill="#3a3f47"><tspan font-weight="600" fill="#04060a">Category</tspan> chip is colour-coded by the four-card grid above (Q / D / I / C); <tspan font-weight="600" fill="#04060a">Modifier</tspan> chips (zero or more) add provenance metadata; the <tspan font-weight="600" fill="#04060a">Status</tspan> chip closes the strip and is never bare — at minimum</text>
  <text x="56" y="766" font-size="11.5" fill="#3a3f47">a chip says <tspan font-family="monospace" font-weight="600" fill="#04060a">unresolved</tspan>. Phases P0/P2/P4 in the footer of each category card list where that item type is permitted to be raised during a run.</text>

  <!-- ============================================================ -->
  <!--               RIGHT EDGE · TONES LEGEND                      -->
  <!-- ============================================================ -->
  <!-- legend column from x=1456 to x=1604, top y=120 -->
  <rect x="1456" y="120" width="148" height="700" rx="14" fill="white" stroke="#e7e3d9" filter="url(#cardShadow)"/>

  <text x="1530" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#6f7480" letter-spacing="2">TONES</text>
  <line x1="1476" y1="160" x2="1584" y2="160" stroke="#e7e3d9"/>

  <!-- 8 tone swatches stacked, each row: 24x24 chip + name + hex -->
  <!-- row height ~ 78, starting y=180 -->

  <!-- info -->
  <rect x="1480" y="180" width="28" height="28" rx="14" fill="#e3edfb" stroke="#6b9cf0" stroke-width="1.5"/>
  <text x="1518" y="194" font-size="11" font-weight="600" fill="#04060a">info</text>
  <text x="1518" y="208" font-size="9" font-family="monospace" fill="#4d5159">#6b9cf0</text>
  <text x="1518" y="220" font-size="9" font-style="italic" fill="#6f7480">Question</text>

  <!-- ok -->
  <rect x="1480" y="240" width="28" height="28" rx="14" fill="#dff0e6" stroke="#4ea072" stroke-width="1.5"/>
  <text x="1518" y="254" font-size="11" font-weight="600" fill="#04060a">ok</text>
  <text x="1518" y="268" font-size="9" font-family="monospace" fill="#4d5159">#4ea072</text>
  <text x="1518" y="280" font-size="9" font-style="italic" fill="#6f7480">resolved</text>

  <!-- warn -->
  <rect x="1480" y="300" width="28" height="28" rx="14" fill="#f7ecd9" stroke="#d4a056" stroke-width="1.5"/>
  <text x="1518" y="314" font-size="11" font-weight="600" fill="#04060a">warn</text>
  <text x="1518" y="328" font-size="9" font-family="monospace" fill="#4d5159">#d4a056</text>
  <text x="1518" y="340" font-size="9" font-style="italic" fill="#6f7480">Disagreement</text>

  <!-- err -->
  <rect x="1480" y="360" width="28" height="28" rx="14" fill="#f8e1e1" stroke="#d96a6a" stroke-width="1.5"/>
  <text x="1518" y="374" font-size="11" font-weight="600" fill="#04060a">err</text>
  <text x="1518" y="388" font-size="9" font-family="monospace" fill="#4d5159">#d96a6a</text>
  <text x="1518" y="400" font-size="9" font-style="italic" fill="#6f7480">Issue</text>

  <!-- idle -->
  <rect x="1480" y="420" width="28" height="28" rx="14" fill="#ebedef" stroke="#7d8290" stroke-width="1.5"/>
  <text x="1518" y="434" font-size="11" font-weight="600" fill="#04060a">idle</text>
  <text x="1518" y="448" font-size="9" font-family="monospace" fill="#4d5159">#7d8290</text>
  <text x="1518" y="460" font-size="9" font-style="italic" fill="#6f7480">Comment</text>

  <!-- claude -->
  <rect x="1480" y="480" width="28" height="28" rx="14" fill="#d4a574" stroke="#b88955" stroke-width="1.5"/>
  <text x="1518" y="494" font-size="11" font-weight="600" fill="#04060a">claude</text>
  <text x="1518" y="508" font-size="9" font-family="monospace" fill="#4d5159">#d4a574</text>
  <text x="1518" y="520" font-size="9" font-style="italic" fill="#6f7480">provider</text>

  <!-- gpt -->
  <rect x="1480" y="540" width="28" height="28" rx="14" fill="#7cc4b8" stroke="#4f9b8f" stroke-width="1.5"/>
  <text x="1518" y="554" font-size="11" font-weight="600" fill="#04060a">gpt</text>
  <text x="1518" y="568" font-size="9" font-family="monospace" fill="#4d5159">#7cc4b8</text>
  <text x="1518" y="580" font-size="9" font-style="italic" fill="#6f7480">provider</text>

  <!-- neutral -->
  <rect x="1480" y="600" width="28" height="28" rx="14" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1518" y="614" font-size="11" font-weight="600" fill="#04060a">neutral</text>
  <text x="1518" y="628" font-size="9" font-family="monospace" fill="#4d5159">#6b7280</text>
  <text x="1518" y="640" font-size="9" font-style="italic" fill="#6f7480">modifier</text>

  <!-- legend footer note -->
  <line x1="1476" y1="676" x2="1584" y2="676" stroke="#e7e3d9"/>
  <text x="1530" y="696" text-anchor="middle" font-size="9" fill="#4d5159" font-style="italic">eight canonical tones</text>
  <text x="1530" y="710" text-anchor="middle" font-size="9" fill="#4d5159" font-style="italic">applied across the UI</text>

  <!-- ================= PAGE FOOTER ================= -->
  <line x1="56" y1="820" x2="1604" y2="820" stroke="#d2cdc0"/>
  <text x="56" y="846" font-size="11" font-weight="600" fill="#4d5159" letter-spacing="1.6">REFERENCE · NO MOTION</text>
  <text x="56" y="866" font-size="12" font-style="italic" fill="#4d5159">The four cards above are the closed taxonomy. The strip below is the canonical card-header order. Point at a chip in the app; find its category card here in under five seconds.</text>
</svg>
