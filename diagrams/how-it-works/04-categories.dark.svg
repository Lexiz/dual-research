<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="880" viewBox="0 0 1660 880" preserveAspectRatio="xMidYMid meet" font-family="Roboto Flex, Roboto, system-ui, -apple-system, sans-serif">

  <!-- ================= DEFS ================= -->
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f12"/><stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
  </defs>

  <!-- ================= CANVAS ================= -->
  <rect width="1660" height="880" fill="url(#bgGrad)"/>

  <!-- ================= TITLE ================= -->
  <text x="830" y="56" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Item categories · chip composition reference</text>
  <text x="830" y="82" text-anchor="middle" font-size="13" fill="#9aa0ac">How to read any chip in a Dual Research conversation · point at a chip in the app, find its card here in seconds</text>

  <!-- ================= SECTION 1 LABEL ================= -->
  <text x="56" y="120" font-size="10" font-weight="600" fill="#7d8290" letter-spacing="2">THE FOUR CATEGORIES · every item raised by an agent is exactly one of these</text>

  <!-- ============================================================ -->
  <!--               TOP REGION · FOUR CATEGORY CARDS               -->
  <!-- ============================================================ -->

  <!-- ================= CARD 1 · Q · QUESTION ================= -->
  <rect x="76" y="140" width="320" height="280" rx="16" fill="#21252b" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <!-- bubble (info bg ~18% on dark, info-dark outline) -->
  <circle cx="236" cy="244" r="62" fill="#27384f" stroke="#84afff" stroke-width="1.5"/>
  <text x="236" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#84afff" letter-spacing="-2">Q</text>

  <text x="236" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#84afff">Question</text>
  <text x="236" y="358" text-anchor="middle" font-size="11" fill="#c5c2bb">I don't know; the other agent</text>
  <text x="236" y="373" text-anchor="middle" font-size="11" fill="#c5c2bb">does or should research.</text>

  <line x1="96" y1="392" x2="376" y2="392" stroke="rgba(255,255,255,0.10)"/>
  <text x="96" y="408" font-size="9" font-weight="600" fill="#7d8290" letter-spacing="1.6">RAISED IN</text>
  <rect x="178" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="196" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P0</text>
  <rect x="222" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="240" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P2</text>
  <rect x="266" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="284" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P4</text>

  <!-- ================= CARD 2 · D · DISAGREEMENT ================= -->
  <rect x="416" y="140" width="320" height="280" rx="16" fill="#21252b" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <circle cx="576" cy="244" r="62" fill="#4a3d22" stroke="#e5b86b" stroke-width="1.5"/>
  <text x="576" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#e5b86b" letter-spacing="-2">D</text>

  <text x="576" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#e5b86b">Disagreement</text>
  <text x="576" y="358" text-anchor="middle" font-size="11" fill="#c5c2bb">I hold X; they hold Y;</text>
  <text x="576" y="373" text-anchor="middle" font-size="11" fill="#c5c2bb">we differ on substance.</text>

  <line x1="436" y1="392" x2="716" y2="392" stroke="rgba(255,255,255,0.10)"/>
  <text x="436" y="408" font-size="9" font-weight="600" fill="#7d8290" letter-spacing="1.6">RAISED IN</text>
  <rect x="518" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="536" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P0</text>
  <rect x="562" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="580" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P2</text>
  <rect x="606" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="624" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P4</text>

  <!-- ================= CARD 3 · I · ISSUE ================= -->
  <rect x="756" y="140" width="320" height="280" rx="16" fill="#21252b" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <circle cx="916" cy="244" r="62" fill="#4d2a2a" stroke="#ed7d7d" stroke-width="1.5"/>
  <text x="916" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#ed7d7d" letter-spacing="-2">I</text>

  <text x="916" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#ed7d7d">Issue</text>
  <text x="916" y="358" text-anchor="middle" font-size="11" fill="#c5c2bb">The drafted document is</text>
  <text x="916" y="373" text-anchor="middle" font-size="11" fill="#c5c2bb">defective in a specific way.</text>

  <line x1="776" y1="392" x2="1056" y2="392" stroke="rgba(255,255,255,0.10)"/>
  <text x="776" y="408" font-size="9" font-weight="600" fill="#7d8290" letter-spacing="1.6">RAISED IN</text>
  <rect x="898" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="916" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P4</text>

  <!-- ================= CARD 4 · C · COMMENT ================= -->
  <rect x="1096" y="140" width="320" height="280" rx="16" fill="#21252b" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <circle cx="1256" cy="244" r="62" fill="#2e323a" stroke="#8e96a3" stroke-width="1.5"/>
  <text x="1256" y="270" text-anchor="middle" font-size="60" font-weight="700" fill="#8e96a3" letter-spacing="-2">C</text>

  <text x="1256" y="334" text-anchor="middle" font-size="17" font-weight="600" fill="#8e96a3">Comment</text>
  <text x="1256" y="358" text-anchor="middle" font-size="11" fill="#c5c2bb">Could be improved in a</text>
  <text x="1256" y="373" text-anchor="middle" font-size="11" fill="#c5c2bb">non-defect way.</text>

  <line x1="1116" y1="392" x2="1396" y2="392" stroke="rgba(255,255,255,0.10)"/>
  <text x="1116" y="408" font-size="9" font-weight="600" fill="#7d8290" letter-spacing="1.6">RAISED IN</text>
  <rect x="1238" y="398" width="36" height="18" rx="9" fill="#1f1f28" stroke="rgba(255,255,255,0.14)"/>
  <text x="1256" y="411" text-anchor="middle" font-size="10" font-family="monospace" font-weight="600" fill="#c5c2bb">P4</text>

  <!-- ================= SECTION DIVIDER ================= -->
  <line x1="56" y1="468" x2="1436" y2="468" stroke="rgba(255,255,255,0.10)"/>

  <!-- ================= SECTION 2 LABEL ================= -->
  <text x="56" y="500" font-size="10" font-weight="600" fill="#7d8290" letter-spacing="2">ANATOMY OF A CARD HEADER · slots, left → right</text>

  <!-- ============================================================ -->
  <!--          BOTTOM REGION · CHIP COMPOSITION STRIP              -->
  <!-- ============================================================ -->

  <!-- strip card background -->
  <rect x="76" y="540" width="1340" height="80" rx="14" fill="#2a2a35" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <!-- Caption labels ABOVE each chip -->
  <text x="158" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">PROVIDER</text>
  <text x="280" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">ACTIVITY</text>
  <text x="425" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">CATEGORY</text>
  <text x="592" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">MODIFIER</text>
  <text x="736" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">MODIFIER</text>
  <text x="914" y="532" text-anchor="middle" font-size="9" font-weight="600" fill="#9aa0ac" letter-spacing="1.4" font-family="monospace">STATUS</text>

  <!-- ================= CHIP 1 · [Claude] ================= -->
  <rect x="100" y="564" width="116" height="32" rx="16" fill="#e6b88f" stroke="#b88955" stroke-width="1"/>
  <circle cx="118" cy="580" r="9" fill="#0d0f12"/>
  <text x="118" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#e6b88f">C</text>
  <text x="135" y="584" font-size="12" font-weight="600" fill="#0d0f12">Claude</text>

  <path d="M 222 580 L 230 580" stroke="#7d8290" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 2 · [turn 3] ================= -->
  <rect x="236" y="564" width="88" height="32" rx="16" fill="#1f1f28" stroke="rgba(255,255,255,0.18)"/>
  <text x="280" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#ffffff">turn 3</text>

  <path d="M 330 580 L 338 580" stroke="#7d8290" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 3 · [Q · Question] ================= -->
  <rect x="344" y="564" width="162" height="32" rx="16" fill="#27384f" stroke="#84afff"/>
  <circle cx="362" cy="580" r="10" fill="#0d0f12" stroke="#84afff" stroke-width="1.2"/>
  <text x="362" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#84afff">Q</text>
  <text x="378" y="584" font-size="12" font-weight="600" fill="#aac4f5">Question</text>

  <path d="M 512 580 L 520 580" stroke="#7d8290" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 4 · [raised in r2] ================= -->
  <rect x="526" y="564" width="132" height="32" rx="16" fill="#1f1f28" stroke="rgba(255,255,255,0.18)"/>
  <text x="592" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#ffffff">raised in r2</text>

  <path d="M 664 580 L 672 580" stroke="#7d8290" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 5 · [Sources 4] ================= -->
  <rect x="678" y="564" width="116" height="32" rx="16" fill="#1f1f28" stroke="rgba(255,255,255,0.18)"/>
  <text x="736" y="584" text-anchor="middle" font-size="12" font-family="monospace" font-weight="500" fill="#ffffff">Sources 4</text>

  <path d="M 800 580 L 808 580" stroke="#7d8290" stroke-width="1.4" fill="none" marker-end="url(#sepArrow)"/>

  <!-- ================= CHIP 6 · [✓ resolved in r4] ================= -->
  <rect x="814" y="564" width="200" height="32" rx="16" fill="#1c3a2a" stroke="#6cc295"/>
  <path d="M 829 580 L 835 586 L 845 574" stroke="#6cc295" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="853" y="584" font-size="12" font-weight="600" fill="#9ee0bd">resolved in r4</text>

  <!-- marker for chevrons -->
  <defs>
    <marker id="sepArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7d8290"/>
    </marker>
  </defs>

  <!-- ================= RULE (composition) ================= -->
  <text x="746" y="660" text-anchor="middle" font-size="13" font-style="italic" fill="#9aa0ac">"Provider first. Status last (and never bare). Categories in canonical Q &#8594; D &#8594; I &#8594; C order when multiple appear together."</text>

  <!-- ================= READING NOTES (footer) ================= -->
  <text x="56" y="710" font-size="10" font-weight="600" fill="#7d8290" letter-spacing="2">HOW TO READ</text>
  <text x="56" y="730" font-size="11.5" fill="#c5c2bb">Every card in a Dual Research conversation carries a header strip like the one above. The <tspan font-weight="600" fill="#ffffff">Provider</tspan> chip identifies which agent posted it; the <tspan font-weight="600" fill="#ffffff">Activity</tspan> chip says where in the run it appeared; the</text>
  <text x="56" y="748" font-size="11.5" fill="#c5c2bb"><tspan font-weight="600" fill="#ffffff">Category</tspan> chip is colour-coded by the four-card grid above (Q / D / I / C); <tspan font-weight="600" fill="#ffffff">Modifier</tspan> chips (zero or more) add provenance metadata; the <tspan font-weight="600" fill="#ffffff">Status</tspan> chip closes the strip and is never bare — at minimum</text>
  <text x="56" y="766" font-size="11.5" fill="#c5c2bb">a chip says <tspan font-family="monospace" font-weight="600" fill="#ffffff">unresolved</tspan>. Phases P0/P2/P4 in the footer of each category card list where that item type is permitted to be raised during a run.</text>

  <!-- ============================================================ -->
  <!--               RIGHT EDGE · TONES LEGEND                      -->
  <!-- ============================================================ -->
  <rect x="1456" y="120" width="148" height="700" rx="14" fill="#21252b" stroke="rgba(255,255,255,0.10)" filter="url(#cardShadow)"/>

  <text x="1530" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#7d8290" letter-spacing="2">TONES</text>
  <line x1="1476" y1="160" x2="1584" y2="160" stroke="rgba(255,255,255,0.10)"/>

  <!-- info -->
  <rect x="1480" y="180" width="28" height="28" rx="14" fill="#27384f" stroke="#84afff" stroke-width="1.5"/>
  <text x="1518" y="194" font-size="11" font-weight="600" fill="#ffffff">info</text>
  <text x="1518" y="208" font-size="9" font-family="monospace" fill="#9aa0ac">#6b9cf0</text>
  <text x="1518" y="220" font-size="9" font-style="italic" fill="#7d8290">Question</text>

  <!-- ok -->
  <rect x="1480" y="240" width="28" height="28" rx="14" fill="#1c3a2a" stroke="#6cc295" stroke-width="1.5"/>
  <text x="1518" y="254" font-size="11" font-weight="600" fill="#ffffff">ok</text>
  <text x="1518" y="268" font-size="9" font-family="monospace" fill="#9aa0ac">#4ea072</text>
  <text x="1518" y="280" font-size="9" font-style="italic" fill="#7d8290">resolved</text>

  <!-- warn -->
  <rect x="1480" y="300" width="28" height="28" rx="14" fill="#4a3d22" stroke="#e5b86b" stroke-width="1.5"/>
  <text x="1518" y="314" font-size="11" font-weight="600" fill="#ffffff">warn</text>
  <text x="1518" y="328" font-size="9" font-family="monospace" fill="#9aa0ac">#d4a056</text>
  <text x="1518" y="340" font-size="9" font-style="italic" fill="#7d8290">Disagreement</text>

  <!-- err -->
  <rect x="1480" y="360" width="28" height="28" rx="14" fill="#4d2a2a" stroke="#ed7d7d" stroke-width="1.5"/>
  <text x="1518" y="374" font-size="11" font-weight="600" fill="#ffffff">err</text>
  <text x="1518" y="388" font-size="9" font-family="monospace" fill="#9aa0ac">#d96a6a</text>
  <text x="1518" y="400" font-size="9" font-style="italic" fill="#7d8290">Issue</text>

  <!-- idle -->
  <rect x="1480" y="420" width="28" height="28" rx="14" fill="#2e323a" stroke="#8e96a3" stroke-width="1.5"/>
  <text x="1518" y="434" font-size="11" font-weight="600" fill="#ffffff">idle</text>
  <text x="1518" y="448" font-size="9" font-family="monospace" fill="#9aa0ac">#7d8290</text>
  <text x="1518" y="460" font-size="9" font-style="italic" fill="#7d8290">Comment</text>

  <!-- claude -->
  <rect x="1480" y="480" width="28" height="28" rx="14" fill="#e6b88f" stroke="#b88955" stroke-width="1.5"/>
  <text x="1518" y="494" font-size="11" font-weight="600" fill="#ffffff">claude</text>
  <text x="1518" y="508" font-size="9" font-family="monospace" fill="#9aa0ac">#d4a574</text>
  <text x="1518" y="520" font-size="9" font-style="italic" fill="#7d8290">provider</text>

  <!-- gpt -->
  <rect x="1480" y="540" width="28" height="28" rx="14" fill="#92d7cb" stroke="#4f9b8f" stroke-width="1.5"/>
  <text x="1518" y="554" font-size="11" font-weight="600" fill="#ffffff">gpt</text>
  <text x="1518" y="568" font-size="9" font-family="monospace" fill="#9aa0ac">#7cc4b8</text>
  <text x="1518" y="580" font-size="9" font-style="italic" fill="#7d8290">provider</text>

  <!-- neutral -->
  <rect x="1480" y="600" width="28" height="28" rx="14" fill="#1f1f28" stroke="#8a929f" stroke-width="1.5"/>
  <text x="1518" y="614" font-size="11" font-weight="600" fill="#ffffff">neutral</text>
  <text x="1518" y="628" font-size="9" font-family="monospace" fill="#9aa0ac">#6b7280</text>
  <text x="1518" y="640" font-size="9" font-style="italic" fill="#7d8290">modifier</text>

  <line x1="1476" y1="676" x2="1584" y2="676" stroke="rgba(255,255,255,0.10)"/>
  <text x="1530" y="696" text-anchor="middle" font-size="9" fill="#9aa0ac" font-style="italic">eight canonical tones</text>
  <text x="1530" y="710" text-anchor="middle" font-size="9" fill="#9aa0ac" font-style="italic">applied across the UI</text>

  <!-- ================= PAGE FOOTER ================= -->
  <line x1="56" y1="820" x2="1604" y2="820" stroke="rgba(255,255,255,0.10)"/>
  <text x="56" y="846" font-size="11" font-weight="600" fill="#9aa0ac" letter-spacing="1.6">REFERENCE · NO MOTION</text>
  <text x="56" y="866" font-size="12" font-style="italic" fill="#9aa0ac">The four cards above are the closed taxonomy. The strip below is the canonical card-header order. Point at a chip in the app; find its category card here in under five seconds.</text>
</svg>
