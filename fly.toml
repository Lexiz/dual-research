# Spec 0020 — Fly.io deployment config for the dual-research UI server.
#
# App is created out-of-band (`fly apps create dual-research-alex`); deploy
# with `fly deploy`. Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# UI_BASIC_AUTH_PASSWORD) are set via `fly secrets set ...`.
#
# RUNS_BACKEND=supabase is in [env] below so the server reads from Supabase
# rather than local disk on first boot. Local invocations of
# `dual-research serve` ignore this file entirely.

app = "dual-research-alex"
primary_region = "iad"

# Spec 0200 — rolling replaces bluegreen. Bluegreen (spec 0159) reduced
# cold-boot timeouts but exposed a worse failure mode: the destroy-lease on
# the old "blue" cohort races with parallel `flyctl` sessions, leaving
# zombie machines that accumulate across deploys (see
# project_fly_lease_drift_recovery and handoffs 0187/0188/0189). Rolling
# replaces machines one at a time, in place, with no parallel cohort and
# no destroy-cohort lease, structurally eliminating the lease race.
#
# Cold-boot regression risk from rolling is bounded by the 90s grace
# period below (calibrated in spec 0159 for shared-cpu-1x:512MB) and
# `min_machines_running = 1`, which keeps one machine serving while the
# other rolls. Pairs with `/dev-next` step 21's no-retry rule (spec 0200
# §2.2): on any non-zero `fly deploy` exit the orchestrator diagnoses
# with `fly status` before halting — it NEVER auto-retries `fly deploy`.
[deploy]
  strategy = "rolling"

[build]
  dockerfile = "Dockerfile"

[env]
  RUNS_BACKEND = "supabase"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # Spec 0159 — bumped from 30s to 90s. The 30s margin was too tight
    # for cold boots on `shared-cpu-1x:512MB` (image pull + heavy import
    # graph), routinely landing past Fly's API observation window during
    # rolling deploys.
    grace_period = "90s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
