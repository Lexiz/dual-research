# Spec 0020 — Fly.io deployment config for the dual-research UI server.
#
# App is created out-of-band (`fly apps create dual-research-alex`); deploy
# with `fly deploy`. Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# UI_BASIC_AUTH_PASSWORD) are set via `fly secrets set ...`.
#
# RUNS_BACKEND=supabase is in [env] below so the server reads from Supabase
# rather than local disk on first boot. Local invocations of
# `dual-research serve` ignore this file entirely.

app = "dual-research-alex"
primary_region = "iad"

# Spec 0159 — bluegreen replaces the default rolling deploy. New machines
# boot fully and pass health checks before old machines terminate. Far more
# forgiving than rolling on 2 machines — a slow boot can't strand a
# half-rolled deploy because the old machines stay up until the new ones are
# observably healthy. Mitigates the 9-in-a-row machines-API mid-rolling
# timeout pattern (handoffs 2026-05-22-spec-0141…0150,0153,0156).
[deploy]
  strategy = "bluegreen"

[build]
  dockerfile = "Dockerfile"

[env]
  RUNS_BACKEND = "supabase"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # Spec 0159 — bumped from 30s to 90s. The 30s margin was too tight
    # for cold boots on `shared-cpu-1x:512MB` (image pull + heavy import
    # graph), routinely landing past Fly's API observation window during
    # rolling deploys.
    grace_period = "90s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
