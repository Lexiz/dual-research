name: Spec dashboard

on:
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "handoffs/**"
      - "dashboard/**"
      - "scripts/spec_lifecycle/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

concurrency:
  group: spec-dashboard
  cancel-in-progress: false

permissions:
  contents: read

# Spec 0156 §2.4 — the deploy-to-Pages job was removed because
# Pages-from-Actions isn't enabled for this private repo (`gh api
# /repos/.../pages` returns 422 "Your current plan does not support
# GitHub Pages for this repository"). The render output is still uploaded
# as a generic workflow artifact so it's downloadable from the run UI;
# adding a real hosting path for the rendered dashboard is a follow-up.

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Render dashboard
        run: python -m scripts.spec_lifecycle.render_dashboard --repo-root . --out dashboard/site

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: dashboard/site
          retention-days: 14
