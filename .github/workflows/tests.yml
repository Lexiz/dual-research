name: Tests

# Run pytest on every push to main and every pull request. The project
# uses uv for dependency management; `astral-sh/setup-uv` handles the
# Python 3.14 install automatically from pyproject.toml's
# `requires-python`. Lights up the Claude Code CI monitoring widget.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python from pyproject.toml
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Syntax-check shell scripts
        run: bash -n scripts/setup-stable-worktree.sh

      - name: Run pytest
        run: uv run pytest tests/ -q
